# =============================================================================
# Pipeline Configuration: Item Creation Workflow Implementation
# =============================================================================
#
# Generated: 2026-01-05 09:30:00 UTC
# Last Modified: 2026-01-05 09:30:00 UTC
# Source: ./docs/prd/Plan-093-Item-Creation-Workflow.md
#
# This file contains ALL project-specific configuration for the Item Creation
# Workflow component implementation. The orchestrator reads this file and makes
# no assumptions beyond it.
#
# Usage:
#   python pipeline_orchestrator.py --config ./pipeline-item-creation-workflow.yaml
#   python pipeline_orchestrator.py --config ./pipeline-item-creation-workflow.yaml --dry-run
#   python pipeline_orchestrator.py --config ./pipeline-item-creation-workflow.yaml --list-tasks
#   python pipeline_orchestrator.py --config ./pipeline-item-creation-workflow.yaml --tasks "1,2,3"
#   python pipeline_orchestrator.py --config ./pipeline-item-creation-workflow.yaml --stages "request,overview"
#
# =============================================================================

pipeline:
  name: item-creation-workflow-implementation
  version: "1.0"
  description: "Process Item Creation Workflow implementation plan through agent pipeline"

  # Pipeline mode:
  #   - "horizontal": All tasks through stage 1, then all through stage 2, etc.
  #   - "per_request": All stages for each task before moving to next task.
  mode: per_request

  # Global default timeout for agent invocations (in seconds)
  default_timeout: 900  # 15 minutes

# =============================================================================
# Source Document
# =============================================================================

source:
  path: ./docs/prd/Plan-093-Item-Creation-Workflow.md

  extraction:
    # Pattern to match task headers like: #### Task 1.1: Component Scaffold & Type Definitions [1 day]
    task_pattern: '^####\s+Task\s+(\d+\.\d+):\s+(.+?)\s*\['
    task_groups:
      id: 1
      title: 2
    # Pattern to match phases like: ### Phase 1: Foundation & Core Infrastructure [5 days]
    phase_pattern: '^###\s+Phase\s+(\d+):\s+(.+?)\s*\['
    phase_groups:
      number: 1
      name: 2
    description:
      mode: following_bullets
      end_patterns:
        - '^####\s+Task'
        - '^###\s+Phase'
        - '^##\s+'
        - '^\*\*Files:\*\*'
        - '^\*\*Acceptance'
        - '^\*\*Implementation'
        - '^---'

# =============================================================================
# Output Locations
# =============================================================================

outputs:
  requests: ./docs/gen_requests.md
  overviews: ./docs/
  details: ./docs/
  state: ./pipeline-item-creation-workflow-state.json
  logs: ./pipeline-item-creation-workflow.log

# =============================================================================
# Request Stages (Per-Request Mode)
# =============================================================================
# These stages run in sequence FOR EACH task/request before moving to the next.
# Flow: Task1(request->overview->details->impl) -> Task2(request->overview->details->impl) -> ...

request_stages:
  # -------------------------------------------------------------------------
  # Stage 1: Create Request
  # -------------------------------------------------------------------------
  - id: request
    name: "Create Request"
    description: "Convert implementation task into formal requirement"
    enabled: true

    agent:
      name: "01-request-fa"
      invocation_template: "use agent 01-request-fa to create the request for: {full_task}"
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Bash"
      timeout: 240  # 4 minutes

    output:
      type: append
      file: ./docs/gen_requests.md

  # -------------------------------------------------------------------------
  # Stage 2: Create Overview
  # -------------------------------------------------------------------------
  - id: overview
    name: "Create Overview"
    description: "Pull relevant context from codebase for the request"
    enabled: true

    agent:
      name: "02-techlead-overview"
      invocation_template: |
        Acting as a Technical Lead, create an implementation breakdown document for:
        {requests_file_path} - Request #{request_id_num}

        **Implementation Plan Reference**: {implementation_plan_path}

        **Task Context**:
        - Phase: {phase} - {phase_name}
        - Task ID: {task_id}
        - Title: {task_title}
        - Details:
            {task_description_formatted}

        **Output file**: docs/{request_id}-{task_title_slug}-overview.md

        **Instructions**:
        1. Read the request from {requests_file_path} (find Request #{request_id_num})
        2. Read the implementation plan from {implementation_plan_path} for:
           - Component hierarchy and file structure
           - Phase dependencies and task relationships
           - Technical decisions (state management, libraries, patterns)
           - Integration with ItemCapture component
           - Authorized files/locations for this component
        3. Investigate the codebase for existing patterns to follow:
           - ItemCapture patterns (useReducer state management)
           - ItemManager barrel exports and structure
           - QR code generation patterns
           - PDF generation services
        4. Create the overview document following the standard structure
        5. Include an "Authorized Files and Functions for Modification" section
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Bash"
      timeout: 660  # 11 minutes

    output:
      type: file
      directory: ./docs/
      filename: "{request_id}-{task_title_slug}-overview.md"

  # -------------------------------------------------------------------------
  # Stage 3: Create Detailed Task Breakdown
  # -------------------------------------------------------------------------
  - id: details
    name: "Create Detailed Tasks"
    description: "Break request into 1-point implementation tasks"
    enabled: true

    agent:
      name: "03-senior-dev-task-breakdown"
      invocation_template: |
        Create a detailed task breakdown document for Request #{request_id_num}

        **Input Documents** (you MUST read these first):
        - Overview document: {overview_file}
        - Requirements: {requests_file_path} (find Request #{request_id_num})
        - Implementation Plan: {implementation_plan_path}
        - Project README: README.md

        **Task Context**:
        - Phase: {phase} - {phase_name}
        - Task ID: {task_id}
        - Title: {task_title}

        **Output file**: docs/{request_id}-{task_title_slug}-detailed.md

        **Pre-Analysis Steps**:
        1. Read the overview document at {overview_file}
        2. Review README.md for project conventions
        3. Check existing ItemCapture/ItemManager patterns
        4. Identify the "Authorized Files and Functions for Modification" from the overview

        **Requirements**:
        - Each numbered task must be <= 1 story point (a few hours of focused work)
        - Include testing tasks for each implementation
        - Only modify files listed in the authorized section of the overview
        - Use actual system date/time in the document header
        - All file paths relative to project root
        - Include verification steps for each task
        - Solutions must be input-driven, not example-specific
        - Follow established patterns from ItemCapture/ItemManager
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Bash"
      timeout: 480  # 8 minutes

    output:
      type: file
      directory: ./docs/
      filename: "{request_id}-{task_title_slug}-detailed.md"

  # -------------------------------------------------------------------------
  # Stage 4: Implementation
  # -------------------------------------------------------------------------
  - id: implementation
    name: "Implementation"
    description: "Autonomously implement all tasks from the detailed specification"
    enabled: true

    agent:
      name: "04-spec-implementation"
      invocation_template: |
        Implement all tasks from the detailed specification for Request #{request_id_num}

        **Detailed Specification**: {details_file}

        **Task Context**:
        - Request ID: {request_id}
        - Phase: {phase} - {phase_name}
        - Task ID: {task_id}
        - Title: {task_title}

        {project_context}

        **Instructions**:
        1. Read the detailed specification at {details_file}
        2. Execute all tasks following the per-task workflow:
           - Implement -> Verify -> Update Doc -> Build -> Commit
        3. Mark completed tasks with [x] and add implementation notes
        4. Continue autonomously until all required tasks are complete
        5. Report final status with summary of completed/failed/blocked tasks

        **Key Patterns to Follow**:
        - Use useReducer pattern for state management (like ItemCapture)
        - Barrel export structure (like ItemManager)
        - Colocated types (ComponentName.types.ts)
        - Hooks directory for custom hooks
        - Shared components in components/shared/
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Edit,Bash,Glob,Grep,mcp__playwright__*"
      timeout: 1800  # 30 minutes

    output:
      type: implementation

  # Stage 5: QA Validation
  - id: qa_validation
    name: "QA Validation"
    description: "Validate that implementation matches the detailed specification"
    enabled: true
    validates: implementation
    max_validation_retries: 1
    agent:
      name: "05-qa-validation"
      invocation_template: |
        Validate the implementation for Request #{request_id_num}

        **Detailed Specification**: {details_file}

        **Task Context**:
        - Request ID: {request_id}
        - Task ID: {task_id}
        - Title: {task_title}

        **Instructions**:
        1. Read the detailed specification at {details_file}
        2. For EACH subtask marked as complete ([x]):
           a. Verify the implementation matches what was specified
           b. Check the implementation note matches the actual code
           c. Verify the target files exist and contain the expected changes
        3. Run type check and build verification
        4. Output a QA Validation Report with:
           - **Status**: PASS or FAIL
           - Summary of subtasks checked
           - Detailed issues (if any) with specific fix instructions
        5. If issues found, format them clearly for the implementation agent to fix on retry
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Glob,Grep,Bash"
        - "--dangerously-skip-permissions"
      timeout: 1200
    output:
      type: validation
      # Output is tracked via git commits and doc updates

  # -------------------------------------------------------------------------
  # Stage 6: Test Verification & Harness Generation (Pipeline-Level)
  # -------------------------------------------------------------------------
  # This stage runs ONCE for the entire pipeline, not per-task.
  # It verifies all implementations and creates a unified test harness.
  - id: testcheck
    name: "Test Verification"
    description: "Verify implementation against specs and create/deploy test harness"
    enabled: true
    mode: pipeline  # Runs once for entire pipeline, not per-task

    agent:
      name: "06a-pipeline-testcheck"
      invocation_template: |
        Execute the 06a-pipeline-testcheck agent for the pipeline.

        **Pipeline Config**: {pipeline_yaml_path}
        **State File**: {state_file_path}
        **Implementation Plan**: {implementation_plan_path}
        **Total Tasks**: {total_tasks}

        Follow the workflow defined in ~/.claude/agents/06a-pipeline-testcheck.md:

        **Phase 1: Discovery**
        - Read the pipeline YAML and state file
        - Collect all detailed spec files from docs/

        **Phase 2: Specification Analysis**
        - Parse each detailed spec to extract components, exports, types, use cases

        **Phase 3: Implementation Verification**
        - Verify files exist at src/components/ItemCreationWorkflow/
        - Verify exports in index.ts
        - Check types match specs
        - Record any discrepancies

        **Phase 4: Test Harness Generation**
        - Create/update test harness page at /src/app/test/item-creation-workflow/page.tsx
        - Update test index at /src/app/test/page.tsx with use cases

        **Phase 5: Build & Deploy**
        - Run npm run build to verify no compilation errors
        - Deploy to Railway
        - Verify deployed URL is accessible

        **Phase 6: State Update**
        - Update state file with verification results

        Report findings including discrepancies, test harness status, build status, and deployed URL.
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Edit,Bash,Glob,Grep,WebFetch"
      timeout: 900  # 15 minutes for full pipeline verification

    output:
      type: verification
      # Output tracked in state file verification section

  # -------------------------------------------------------------------------
  # Stage 7: Use Case Test Generation (Pipeline-Level)
  # -------------------------------------------------------------------------
  # This stage runs ONCE after testcheck to generate aggregate use case tests
  # based on the PRD intent.
  - id: usecases
    name: "Use Case Generation"
    description: "Generate aggregate end-to-end test scenarios from PRD intent"
    enabled: true
    mode: pipeline  # Runs once for entire pipeline, not per-task

    agent:
      name: "06b-usecase-generator"
      invocation_template: |
        Execute the 06b-usecase-generator agent for the pipeline.

        **Pipeline Config**: {pipeline_yaml_path}
        **State File**: {state_file_path}
        **PRD/Implementation Plan**: {implementation_plan_path}
        **Total Tasks**: {total_tasks}

        Follow the workflow defined in ~/.claude/agents/06b-usecase-generator.md:

        **Phase 1: Intent Discovery**
        - Read the PRD/Implementation Plan at {implementation_plan_path}
        - Extract user goals, journeys, success criteria, and edge cases
        - Identify use case categories: happy-path, error-handling, edge-case, integration

        **Phase 2: Component Mapping**
        - Read the pipeline state to understand implemented components
        - Map PRD intent to implemented components
        - Identify integration points between components

        **Phase 3: Use Case Generation**
        - Generate use cases from PRD sections (1-3 per feature/story)
        - Include steps, expected outcomes, and components involved
        - Prioritize: P0 (critical paths), P1 (error scenarios), P2 (edge cases)

        **Phase 4: Test Page Update**
        - Update the pipeline test harness at /src/app/test/item-creation-workflow/page.tsx
        - Add "Use Cases" section with interactive test guides
        - Each use case as a clickable card with step-by-step instructions

        **Phase 5: Documentation Update**
        - Update state file with use case metadata
        - Log summary of generated use cases

        Generate comprehensive use cases that validate the system works as a cohesive whole.
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Edit,Bash,Glob,Grep"
      timeout: 600  # 10 minutes for use case generation

    output:
      type: usecases
      # Output tracked in state file usecases section

# =============================================================================
# Implementation Configuration
# =============================================================================
# Technology context and tool requirements for the implementation stage.

implementation:
  technology:
    # Database: none - ItemCreationWorkflow uses localStorage for session persistence
    database: none
    # Browser testing required for UI components
    browser_testing: true

  required_tools:
    - playwright_mcp  # Required for browser-based verification of UI components

  precheck:
    timeout: 120  # 2 minutes

# =============================================================================
# Retry Configuration (Global)
# =============================================================================

retry:
  max_attempts: 2
  on_failure: skip_and_log

# =============================================================================
# Legacy Stages (Horizontal Mode - Not Used in per_request mode)
# =============================================================================
# These are kept for backward compatibility if you switch to horizontal mode.

stages:
  - id: request
    name: "Request Generation"
    enabled: false
    agent:
      name: "01-request-fa"
      invocation_template: "use agent 01-request-fa to create the request for: {full_task}"
      command:
        - "claude"
        - "-p"
        - "{prompt}"
    retry:
      max_attempts: 2
      on_failure: skip_and_log
    stop_hook: false
