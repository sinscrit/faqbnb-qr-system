# =============================================================================
# Pipeline Configuration: FAQBNB Review - Comprehensive Implementation
# =============================================================================
#
# Generated: 2026-01-11 15:30:00 PST
# Last Modified: 2026-01-11 15:30:00 PST
# Source: ./docs/prd/Plan-099-FAQBNB-Review-Comprehensive-Implementation.md
#
# This file contains ALL project-specific configuration for the FAQBNB Review
# Comprehensive Implementation. The orchestrator reads this file and makes no
# assumptions beyond it.
#
# Usage:
#   python pipeline_orchestrator.py --config ./pipeline-faqbnb-review-comprehensive.yaml
#   python pipeline_orchestrator.py --config ./pipeline-faqbnb-review-comprehensive.yaml --dry-run
#   python pipeline_orchestrator.py --config ./pipeline-faqbnb-review-comprehensive.yaml --list-tasks
#   python pipeline_orchestrator.py --config ./pipeline-faqbnb-review-comprehensive.yaml --tasks "1,2,3"
#   python pipeline_orchestrator.py --config ./pipeline-faqbnb-review-comprehensive.yaml --stages "request,overview"
#
# =============================================================================

pipeline:
  name: faqbnb-review-comprehensive
  version: "1.0"
  description: "Process FAQBNB Review comprehensive implementation plan through agent pipeline (5 change requests)"

  # Pipeline mode:
  #   - "horizontal": All tasks through stage 1, then all through stage 2, etc.
  #   - "per_request": All stages for each task before moving to next task.
  #   - "hybrid": Stages 1-2 horizontal → dependency analysis → Stages 3-4 in dependency order
  #   - "parallel": Like hybrid, but runs independent task clusters in parallel worktrees
  mode: hybrid

  # Global default timeout for agent invocations (in seconds)
  default_timeout: 900  # 15 minutes

# =============================================================================
# Parallelization Configuration
# =============================================================================
# When mode is "parallel", independent task clusters can run concurrently
# using git worktrees. This section configures that behavior.

parallelization:
  enabled: false  # Set to true to enable worktree-based parallel execution

  # Maximum concurrent worktrees (agents running in parallel)
  max_concurrent: 3

  # Branch naming pattern for worktrees
  branch_pattern: "pipeline/{pipeline_name}/{cluster_id}"

  # Worktree directory pattern (relative to repo root)
  worktree_dir: "../.worktrees/{pipeline_name}/{cluster_id}"

  # Merge strategy when parallel work completes
  merge_strategy: "sequential"  # sequential | rebase | squash

  # Whether to delete worktrees after successful merge
  cleanup_worktrees: true

  # Conflict resolution
  on_merge_conflict: "pause_and_notify"  # pause_and_notify | abort | manual

# =============================================================================
# Dependency Tracking Configuration
# =============================================================================
# Dependencies are extracted INCREMENTALLY after each Stage 2 completes.
# This ensures dependency info is always available, regardless of pipeline mode.

dependency_tracking:
  enabled: true

  # How to extract dependencies from overview documents
  extraction:
    # Section header to look for
    section_pattern: "^## Dependencies"

    # Subsection patterns
    depends_on_pattern: "^### Depends On"
    blocks_pattern: "^### Blocks"
    parallel_safety_pattern: "^### Parallel Safety"

    # Task reference pattern (e.g., "Task 1.1", "Task 2.2")
    task_ref_pattern: "Task\\s+(\\d+\\.\\d+)"

    # File list pattern (for conflict detection)
    files_touched_pattern: "Files touched:\\s*(.+)"

  # State file structure for dependencies
  state_schema:
    # Per-task dependency info (updated incrementally)
    tasks:
      # task_id:
      #   depends_on: [task_ids...]
      #   blocks: [task_ids...]
      #   files_touched: [file_paths...]
      #   conflicts_with: [task_ids...]
      #   extracted_at: timestamp

    # Computed graph (recomputed after each extraction)
    graph:
      nodes: []           # All task IDs
      edges: []           # [from, to] dependency pairs
      roots: []           # Tasks with no dependencies (can start immediately)
      leaves: []          # Tasks that nothing depends on

    # Execution planning (recomputed on demand or mode switch)
    execution:
      topological_order: []    # Valid execution sequence
      critical_path: []        # Longest dependency chain
      parallel_clusters: []    # Groups that can run concurrently

  # Validation (runs after each extraction)
  validation:
    # Fail immediately if cycle detected
    fail_on_cycles: true

    # Warn if task has no dependencies (might be missing analysis)
    warn_on_no_dependencies: true

    # Warn if task references unknown task ID
    warn_on_unknown_reference: true

    # Fail if referenced task doesn't exist (stricter)
    fail_on_missing_reference: false  # Set true for strict mode

  # When to recompute parallel clusters
  recompute_clusters:
    # After each dependency extraction
    on_extraction: true

    # Before switching to parallel mode
    on_mode_switch: true

    # On explicit request (--recompute-clusters flag)
    on_demand: true

# =============================================================================
# Source Document
# =============================================================================

source:
  path: ./docs/prd/Plan-099-FAQBNB-Review-Comprehensive-Implementation.md

  extraction:
    # Pattern to match task headers like: - [ ] **1.1** Add `USER_VISIBLE_STEPS` constant to `constants.ts`
    task_pattern: '^\s*-\s*\[\s*\]\s*\*\*(\d+\.\d+)\*\*\s+(.+?)$'
    task_groups:
      id: 1
      title: 2

    # Pattern to match phases like: ## Phase 1: Fix Workflow Step Count (REQ-5)
    phase_pattern: '^##\s+Phase\s+(\d+):\s+(.+?)(?:\s*\(REQ-\d+\))?$'
    phase_groups:
      number: 1
      name: 2

    description:
      mode: following_bullets
      end_patterns:
        - '^\s*-\s*\[\s*\]\s*\*\*'  # Next task (checkbox format)
        - '^##\s+Phase'              # Next phase
        - '^###\s+Tasks'             # End of phase tasks section
        - '^###\s+Files Modified'    # Files section
        - '^\*\*Effort Estimate:\*\*'  # End of phase
        - '^---'                     # Section divider

# =============================================================================
# Output Locations
# =============================================================================

outputs:
  requests: ./docs/gen_requests.md
  overviews: ./docs/
  details: ./docs/
  state: ./pipeline-faqbnb-review-comprehensive-state.json
  logs: ./pipeline-faqbnb-review-comprehensive.log

# =============================================================================
# Request Stages (Per-Request Mode)
# =============================================================================
# These stages run in sequence FOR EACH task/request before moving to the next.
# Flow: Task1(request->overview->details->impl) -> Task2(request->overview->details->impl) -> ...

request_stages:
  # -------------------------------------------------------------------------
  # Stage 1: Create Request
  # -------------------------------------------------------------------------
  - id: request
    name: "Create Request"
    description: "Convert implementation task into formal requirement"
    enabled: true

    agent:
      name: "01-request-fa"
      invocation_template: "use agent 01-request-fa to create the request for: {full_task}"
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Bash"
      timeout: 240  # 4 minutes

    output:
      type: append
      file: ./docs/gen_requests.md

  # -------------------------------------------------------------------------
  # Stage 2: Create Overview
  # -------------------------------------------------------------------------
  - id: overview
    name: "Create Overview"
    description: "Pull relevant context from codebase for the request"
    enabled: true

    agent:
      name: "02-techlead-overview"
      invocation_template: |
        Acting as a Technical Lead, create an implementation breakdown document for:
        {requests_file_path} - Request #{request_id_num}

        **Implementation Plan Reference**: {implementation_plan_path}

        **Task Context**:
        - Phase: {phase} - {phase_name}
        - Task ID: {task_id}
        - Title: {task_title}
        - Details:
            {task_description_formatted}

        **Output file**: docs/{request_id}-{task_title_slug}-overview.md

        **Instructions**:
        1. Read the request from {requests_file_path} (find Request #{request_id_num})
        2. Read the implementation plan from {implementation_plan_path} for:
           - REQ-1: Dashboard card clickability updates
           - REQ-2: Data model UI label clarification
           - REQ-3: "What's Next" screen restructuring
           - REQ-4: Navigation menu updates with new Instructions item
           - REQ-5: Workflow step count fixes
           - Component modifications and integration patterns
           - Authorized files/locations for this task
        3. Investigate the codebase for existing patterns to follow:
           - Dashboard component patterns (UserDashboard, KPIDashboardOverview)
           - ItemCreationWorkflow state management patterns
           - Navigation patterns (RoleBasedNavigation)
           - Next.js Link component usage
           - Lucide icon integration
        4. Create the overview document following the standard structure
        5. Include an "Authorized Files and Functions for Modification" section

        **CRITICAL: Dependency Analysis Section**
        You MUST include a "## Dependencies" section in the overview document with:

        ```markdown
        ## Dependencies

        ### Depends On (upstream)
        <!-- Tasks that MUST complete before this task can start -->
        - Task X.Y: [reason - e.g., "requires USER_VISIBLE_STEPS constants defined"]
        - Task X.Z: [reason - e.g., "needs step counter logic updated"]

        ### Blocks (downstream)
        <!-- Tasks that cannot start until this task completes -->
        - Task A.B: [reason - e.g., "What's Next screen needs step count logic"]

        ### Parallel Safety
        <!-- Can this task run in parallel with others? -->
        - Files touched: [list files this task modifies]
        - Conflicts with: [tasks that modify same files - cannot parallelize]
        - Safe to parallelize with: [tasks with no file overlap]
        ```

        Consider these dependency types:
        - **Constants**: Step definitions must exist before components use them
        - **State Management**: Computed values must exist before UI displays them
        - **Components**: Shared components must exist before consumers
        - **UI/UX**: Navigation changes should not conflict with dashboard changes
        - **Workflow Logic**: Step counter logic must be stable before UI uses it
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Bash"
      timeout: 660  # 11 minutes

    output:
      type: file
      directory: ./docs/
      filename: "{request_id}-{task_title_slug}-overview.md"

    # Post-stage hook: Extract dependencies immediately after overview is created
    # This runs after EACH task's Stage 2 completes, not as a batch
    post_stage:
      action: extract_dependencies
      # Orchestrator parses the just-created overview doc and updates state
      # This happens incrementally - dependency graph grows with each task

  # -------------------------------------------------------------------------
  # Stage 3: Create Detailed Task Breakdown
  # -------------------------------------------------------------------------
  - id: details
    name: "Create Detailed Tasks"
    description: "Break request into 1-point implementation tasks"
    enabled: true

    agent:
      name: "03-senior-dev-task-breakdown"
      invocation_template: |
        Create a detailed task breakdown document for Request #{request_id_num}

        **Input Documents** (you MUST read these first):
        - Overview document: {overview_file}
        - Requirements: {requests_file_path} (find Request #{request_id_num})
        - Implementation Plan: {implementation_plan_path}
        - Project README: README.md

        **Task Context**:
        - Phase: {phase} - {phase_name}
        - Task ID: {task_id}
        - Title: {task_title}

        **Output file**: docs/{request_id}-{task_title_slug}-detailed.md

        **Pre-Analysis Steps**:
        1. Read the overview document at {overview_file}
        2. Review README.md for project conventions
        3. Check existing component patterns (Dashboard, Navigation, Workflow)
        4. Identify the "Authorized Files and Functions for Modification" from the overview

        **Requirements**:
        - Each numbered task must be <= 1 story point (a few hours of focused work)
        - Include testing tasks for each implementation
        - Only modify files listed in the authorized section of the overview
        - Use actual system date/time in the document header
        - All file paths relative to project root
        - Include verification steps for each task
        - Solutions must be input-driven, not example-specific
        - Follow established patterns from existing components
        - For UI tasks: include accessibility verification (keyboard navigation, focus states)
        - For workflow tasks: include state management verification
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Bash"
      timeout: 480  # 8 minutes

    output:
      type: file
      directory: ./docs/
      filename: "{request_id}-{task_title_slug}-detailed.md"

  # -------------------------------------------------------------------------
  # Stage 4: Implementation
  # -------------------------------------------------------------------------
  - id: implementation
    name: "Implementation"
    description: "Autonomously implement all tasks from the detailed specification"
    enabled: true

    agent:
      name: "05-spec-implementation"
      invocation_template: |
        Implement all tasks from the detailed specification for Request #{request_id_num}

        **Detailed Specification**: {details_file}

        **Task Context**:
        - Request ID: {request_id}
        - Phase: {phase} - {phase_name}
        - Task ID: {task_id}
        - Title: {task_title}

        {project_context}

        **CRITICAL PATH WARNING**:
        - This project has TWO dashboard paths: `/dashboard/` (legacy) and `/dashboard2/` (current)
        - ALL work must be done in `/dashboard2/` and `/src/app/dashboard2/`
        - The ItemCreationWorkflow component is accessed via `/dashboard2/create`
        - DO NOT modify anything in `/src/app/dashboard/` - that is the legacy version
        - Component paths: `/src/components/` for shared components

        **Instructions**:
        1. Read the detailed specification at {details_file}
        2. Execute all tasks following the per-task workflow:
           - Implement -> Verify -> Update Doc -> Build -> Commit
        3. Mark completed tasks with [x] and add implementation notes
        4. Continue autonomously until all required tasks are complete
        5. Run verification: `npm run type-check` and `npm run build`
        6. Report final status with summary of completed/failed/blocked tasks
        7. **IMPORTANT**: End your response with a test summary in this format:
           ```
           TEST SUMMARY:
           - Type Check: PASSED/FAILED
           - Build: PASSED/FAILED
           - Tests: PASSED/FAILED (if tests were run)
           ```

        **Key Patterns to Follow**:
        - Next.js Link component for navigation
        - Lucide React icons for UI consistency
        - Tailwind CSS for styling
        - React useReducer pattern for state management (in workflows)
        - Responsive design with Tailwind breakpoints (md:, lg:)
        - Component colocation patterns

        **Special Considerations**:
        - REQ-1 (Dashboard Cards): Add hover states, keyboard accessibility
        - REQ-2 (Data Model UI): Clarify labels without changing data model
        - REQ-3 (What's Next): Complete UI restructure, test navigation flow
        - REQ-4 (Navigation): Responsive labels, create placeholder page
        - REQ-5 (Step Count): Preserve state machine logic, update UI display only
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Edit,Bash,Glob,Grep,mcp__playwright__*"
      timeout: 1800  # 30 minutes

    output:
      type: implementation
      # Output is tracked via git commits and doc updates

  # -------------------------------------------------------------------------
  # Stage 5: Test Verification & Harness Generation (Pipeline-Level)
  # -------------------------------------------------------------------------
  # This stage runs ONCE for the entire pipeline, not per-task.
  # It verifies all implementations and creates a unified test harness.
  - id: testcheck
    name: "Test Verification"
    description: "Verify implementation against specs and create/deploy test harness"
    enabled: true
    mode: pipeline  # Runs once for entire pipeline, not per-task

    agent:
      name: "06a-pipeline-testcheck"
      invocation_template: |
        Execute the 06a-pipeline-testcheck agent for the pipeline.

        **Pipeline Config**: {pipeline_yaml_path}
        **State File**: {state_file_path}
        **Implementation Plan**: {implementation_plan_path}
        **Total Tasks**: {total_tasks}

        **CRITICAL PATH WARNING**:
        - This project has TWO dashboard paths: `/dashboard/` (legacy) and `/dashboard2/` (current)
        - ALL verification must target `/dashboard2/` and `/src/app/dashboard2/`
        - DO NOT verify or modify anything in `/src/app/dashboard/` - that is the legacy version
        - Component paths: `/src/components/` for shared components

        Follow the workflow defined in ~/.claude/agents/06a-pipeline-testcheck.md:

        **Phase 1: Discovery**
        - Read the pipeline YAML and state file
        - Collect all detailed spec files from docs/

        **Phase 2: Specification Analysis**
        - Parse each detailed spec to extract components, exports, types, use cases
        - Identify UI/UX changes: dashboard cards, navigation, workflow steps

        **Phase 3: Implementation Verification**
        - Verify dashboard card clickability (UserDashboard, KPIDashboardOverview)
        - Verify data model UI labels (PreviewSaveStep, SpecificItemStep)
        - Verify "What's Next" screen restructure (NextActionStep)
        - Verify navigation menu updates (RoleBasedNavigation, placeholder page)
        - Verify workflow step count logic (constants, useWorkflowState, WorkflowHeader)
        - Check types match specs
        - Record any discrepancies

        **Phase 4: Test Harness Generation**
        - Update test harness page at /src/app/test/faqbnb-review/page.tsx
          → Access at: http://localhost:3000/test/faqbnb-review
        - Add test scenarios for all 5 change requests
        - Update test index at /src/app/test/page.tsx with new use cases
          → Access at: http://localhost:3000/test

        **Phase 5: Build & Deploy**
        - Run npm run build to verify no compilation errors
        - Deploy to Railway (after user confirmation)
        - Verify deployed URL is accessible

        **Phase 6: State Update**
        - Update state file with verification results

        Report findings including discrepancies, test harness status, build status, and deployed URL.
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Edit,Bash,Glob,Grep,WebFetch"
      timeout: 900  # 15 minutes for full pipeline verification

    output:
      type: verification
      # Output tracked in state file verification section

  # -------------------------------------------------------------------------
  # Stage 6: Use Case Test Generation (Pipeline-Level)
  # -------------------------------------------------------------------------
  # This stage runs ONCE after testcheck to generate aggregate use case tests
  # based on the PRD intent.
  - id: usecases
    name: "Use Case Generation"
    description: "Generate aggregate end-to-end test scenarios from PRD intent"
    enabled: true
    mode: pipeline  # Runs once for entire pipeline, not per-task

    agent:
      name: "06b-usecase-generator"
      invocation_template: |
        Execute the 06b-usecase-generator agent for the pipeline.

        **Pipeline Config**: {pipeline_yaml_path}
        **State File**: {state_file_path}
        **PRD/Implementation Plan**: {implementation_plan_path}
        **Total Tasks**: {total_tasks}

        Follow the workflow defined in ~/.claude/agents/06b-usecase-generator.md:

        **Phase 1: Intent Discovery**
        - Read the PRD/Implementation Plan at {implementation_plan_path}
        - Extract user goals, UI/UX improvements, success criteria, and edge cases
        - Identify use case categories: happy-path, error-handling, edge-case, integration

        **Phase 2: Component Mapping**
        - Read the pipeline state to understand implemented components
        - Map PRD intent to implemented components
        - Identify integration points between new/modified components

        **Phase 3: Use Case Generation**
        - Generate use cases from PRD sections (1-3 per feature/story)
        - Include steps, expected outcomes, and components involved
        - Prioritize: P0 (critical paths), P1 (error scenarios), P2 (edge cases)
        - Focus on:
          - REQ-1: Dashboard card navigation
          - REQ-2: Data model UI clarity
          - REQ-3: Post-workflow navigation flow
          - REQ-4: Navigation menu structure and Instructions page
          - REQ-5: Workflow step counter accuracy

        **Phase 4: Test Page Update**
        - Update the pipeline test harness at /src/app/test/faqbnb-review/page.tsx
          → Access at: http://localhost:3000/test/faqbnb-review
        - Add "FAQBNB Review Use Cases" section with interactive test guides
        - Each use case as a clickable card with step-by-step instructions

        **Phase 5: Documentation Update**
        - Update state file with use case metadata
        - Log summary of generated use cases

        Generate comprehensive use cases that validate the FAQBNB review changes work as a cohesive whole.
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Edit,Bash,Glob,Grep"
      timeout: 600  # 10 minutes for use case generation

    output:
      type: usecases
      # Output tracked in state file usecases section

# =============================================================================
# Implementation Configuration
# =============================================================================
# Technology context and tool requirements for the implementation stage.

implementation:
  technology:
    # Database: None for this pipeline (UI/UX changes only)
    database: none
    # Browser testing required for UI components
    browser_testing: true

  required_tools:
    - playwright_mcp  # Required for browser-based verification of UI components

  precheck:
    timeout: 120  # 2 minutes

# =============================================================================
# Retry Configuration (Global)
# =============================================================================

retry:
  max_attempts: 2
  on_failure: skip_and_log

# =============================================================================
# Legacy Stages (Horizontal Mode - Not Used in hybrid mode)
# =============================================================================
# These are kept for backward compatibility if you switch to horizontal mode.

stages:
  - id: request
    name: "Request Generation"
    enabled: false
    agent:
      name: "01-request-fa"
      invocation_template: "use agent 01-request-fa to create the request for: {full_task}"
      command:
        - "claude"
        - "-p"
        - "{prompt}"
    retry:
      max_attempts: 2
      on_failure: skip_and_log
    stop_hook: false

# =============================================================================
# Pipeline Mode Documentation
# =============================================================================
#
# This section documents the different execution modes and how they work.
#
# IMPORTANT: Dependencies are captured INCREMENTALLY in ALL modes.
# After each Stage 2 completes, the post_stage hook extracts dependencies
# from the overview document and updates the state file. This means:
#   - Dependency info is available even if pipeline is interrupted
#   - You can switch modes mid-execution and have dependency data ready
#   - Partial runs still produce useful dependency graphs
#
# -----------------------------------------------------------------------------
# MODE: hybrid (Recommended for this pipeline)
# -----------------------------------------------------------------------------
# Stages 1-2 run horizontally (deps extracted incrementally), then Stages 3-4
# run vertically in dependency order.
#
# This mode is recommended because:
# - Phase 1 (REQ-5: Step Count) must complete before Phase 3 (REQ-3: What's Next)
# - Phase 4 (REQ-1: Dashboard Cards) and Phase 5 (REQ-4: Navigation) are independent
# - Full context gathering before implementation planning
# - Dependency-aware execution order
#
# =============================================================================
# Task Dependencies (Expected)
# =============================================================================
#
# Phase 1 (REQ-5: Step Count):
#   1.1 → 1.2 → 1.3 → 1.4 → 1.5 → 1.6
#   (foundation for step display logic)
#
# Phase 2 (REQ-2: Data Model UI):
#   2.1 → 2.2 → 2.3 → 2.4 → 2.5
#   (independent - UI labeling only)
#
# Phase 3 (REQ-3: What's Next):
#   Depends on: Phase 1 (step count logic)
#   3.1 → 3.2 → 3.3 → 3.4 → 3.5 → 3.6
#
# Phase 4 (REQ-1: Dashboard Cards):
#   Independent
#   4.1 → 4.2 → 4.3 → 4.4
#
# Phase 5 (REQ-4: Navigation):
#   Independent
#   5.1 → 5.2 → 5.3 → 5.4 → 5.5
#
# Parallel Clusters:
#   - Cluster A: Phase 1 (foundation - must run first)
#   - Cluster B: Phase 2 (independent - can run after Phase 1)
#   - Cluster C: Phase 3 (depends on Phase 1)
#   - Cluster D: Phase 4 and Phase 5 (independent of each other)
#
# =============================================================================
