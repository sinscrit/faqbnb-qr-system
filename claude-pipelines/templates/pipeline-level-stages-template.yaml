# Template for Pipeline-Level Stages (precheck, testcheck, usecases)
# Agent 00b MUST use these templates when generating pipeline configurations
# Last Modified: 2026-01-20
#
# Stage 0 (precheck): Runs BEFORE any implementation to verify clean codebase state
# Stages 5-6 (testcheck, usecases): Run ONCE after all per-task stages complete

# =============================================================================
# CONTEXT SECTION (Agent 00b must extract from implementation plan)
# =============================================================================
#
# Agent 00b should extract the following from the implementation plan and embed
# in a 'context' section of the YAML. This provides testcheck/usecases with the
# PRD vision and testing context.
#
# context:
#   prd_vision: |
#     <Extracted from implementation plan header - the overall goal/vision>
#
#   user_stories:
#     - <User story 1 from PRD>
#     - <User story 2 from PRD>
#
#   key_features:
#     - <Feature 1 being implemented>
#     - <Feature 2 being implemented>
#
#   epic_specific_scenarios:
#     - <Testing scenarios specific to this epic>
#     # Examples:
#     # For L10N epic: "Multi-language content display", "Translation fallback"
#     # For Auth epic: "Login flows", "Session management"
#     # For UI epic: "Responsive layout", "Accessibility"

# =============================================================================
# STAGE 0: PRECHECK - Codebase Health Verification (Next.js/TypeScript only)
# =============================================================================
#
# This stage runs BEFORE any implementation begins. It ensures the codebase is
# in a clean state and establishes a baseline for TypeScript errors.
#
# CRITICAL: This prevents cascading failures where Epic N depends on broken
# code from Epic N-1. If precheck fails, the pipeline should not proceed.

precheck_stage_template:
  - id: precheck
    name: "Codebase Health Precheck"
    description: "Verify TypeScript compilation and establish error baseline before implementation"
    mode: pipeline           # Runs ONCE before any per-task stages
    enabled: true
    run_before_tasks: true   # MUST run before any implementation begins
    applies_to: nextjs       # Only for Next.js/TypeScript projects

    # This stage has NO prerequisites - it's the first thing that runs

    checks:
      # TypeScript compilation check
      - name: typescript
        description: "Verify TypeScript compiles without errors in target modules"
        command: "npx tsc --noEmit 2>&1"
        success_criteria: "No errors in modules that will be modified"
        blocking: true       # If target modules have errors, block pipeline

      # Build verification (optional, can be slow)
      - name: build
        description: "Verify project builds successfully"
        command: "npm run build 2>&1 | tail -50"
        success_criteria: "Build completes without errors"
        blocking: false      # Build failures are noted but don't block

    on_failure:
      action: "report_and_block"
      message: |
        ⛔ PRECHECK FAILED: Codebase has TypeScript errors in target modules.

        These errors MUST be fixed before implementation can proceed.
        Continuing would cause cascading failures in dependent tasks.

        Run `npx tsc --noEmit` to see the full error list.

    output:
      type: precheck_report
      fields:
        - typescript_error_count
        - typescript_errors_in_target_modules
        - build_status
        - baseline_recorded
        - proceed_allowed

# =============================================================================
# STAGE 5: TESTCHECK - Pipeline-Level Verification
# =============================================================================

testcheck_stage_template:
  - id: testcheck
    name: "Test Check & Verification"
    description: "Validate implementation against specifications and generate test harness"
    mode: pipeline           # Runs ONCE for entire pipeline, NOT per-task
    enabled: true

    # No prerequisites - testcheck runs whenever called
    # The automated pipeline calls it once after all implementations complete
    # Users can call it anytime to test what's been built so far

    agent:
      name: "06a-pipeline-testcheck"
      invocation_template: |
        Run pipeline-level test verification for: {pipeline_name}

        ## PRD Context
        {prd_vision}

        ## Pipeline Information
        - **Pipeline Configuration**: {pipeline_yaml_path}
        - **State File**: {state_file_path}
        - **Implementation Plan**: {implementation_plan_path}
        - **Total Tasks**: {total_tasks}
        - **Request Range**: {first_request_id} through {last_request_id}

        ## Instructions

        1. **Read State File**: Understand which tasks have implementation_completed=true

        2. **Verify Implementations WITH EVIDENCE CAPTURE**: For each completed task:
           - Read its detailed spec ({request_id}-*-detailed.md)
           - Run verification commands and CAPTURE THE OUTPUT
           - Store evidence for each check performed

           **Evidence Capture Format** (CRITICAL - users will see this in test harness):
           ```json
           {{
             "task_id": "1.1",
             "request_id": "REQ-223",
             "title": "Task title",
             "checks": [
               {{
                 "description": "Verify component file exists",
                 "command": "ls -la src/components/LanguageSwitcher/",
                 "output": "LanguageSwitcher.tsx\\nindex.ts\\n__tests__/",
                 "passed": true
               }},
               {{
                 "description": "Verify all 6 languages defined",
                 "command": "grep -c 'code:' src/lib/i18n/config.ts",
                 "output": "6",
                 "passed": true
               }},
               {{
                 "description": "Unit tests pass",
                 "command": "npm test -- --run src/components/LanguageSwitcher",
                 "output": "PASS src/components/LanguageSwitcher/__tests__/...\\n✓ renders dropdown\\nTests: 8 passed",
                 "passed": true
               }}
             ]
           }}
           ```

           **Types of checks to perform per task:**
           - File existence: `ls -la <expected_path>`
           - Exports: `grep -n "export" <file>`
           - Content verification: `grep "<expected_pattern>" <file>`
           - Type check: `npm run type-check 2>&1 | head -20`
           - Unit tests (if exist): `npm test -- --run <test_file>`

        3. **Build Verification**: Run these commands and capture FULL output:
           ```bash
           npm run type-check 2>&1
           npm run build 2>&1 | tail -30
           ```
           Store as evidence with description "Full build verification"

        4. **Update State File**: Add verification results WITH evidence array:
           ```json
           {{
             "testcheck_completed": true,
             "testcheck_completed_at": "<timestamp>",
             "verification": {{
               "status": "passed|partial|failed",
               "build_status": "passed|failed",
               "type_check_status": "passed|failed",
               "tasks_verified": <count>,
               "issues_found": [],
               "evidence": [
                 // REQUIRED: Array of task evidence objects (see format above)
                 // Each task should have its checks array with command outputs
                 // This is displayed in the test harness "Verification Evidence" tab
               ]
             }},
             "test_harness_url": "src/app/testing/{pipeline_slug}/page.tsx"
           }}
           ```

           **WARNING**: The `evidence` array is displayed visually in the test harness.
           Users can browse each task and see exactly what commands were run and their
           output. This provides audit trail and confidence in the verification.

        5. **Report Status**: Provide summary of verification results including:
           - Total tasks verified
           - Total checks performed
           - Pass/fail counts
           - Any issues found

      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Edit,Bash,Glob,Grep,mcp__supabase__*,mcp__playwright__*"
        - "--dangerously-skip-permissions"
      timeout: 1200  # 20 minutes

    output:
      type: verification
      # Test harness page created at: src/app/testing/{pipeline_slug}/page.tsx

# =============================================================================
# STAGE 6: USECASES - End-to-End Test Scenario Generation
# =============================================================================

usecases_stage_template:
  - id: usecases
    name: "Use Case Test Generation"
    description: "Generate aggregate end-to-end test scenarios based on PRD intent"
    mode: pipeline           # Runs ONCE for entire pipeline
    enabled: true

    # No hard prerequisites - usecases runs whenever called
    # Typically runs after testcheck so test harness exists
    # The automated pipeline calls it once after testcheck

    agent:
      name: "06b-usecase-generator"
      invocation_template: |
        Generate end-to-end use case test scenarios for: {pipeline_name}

        ## PRD Vision
        {prd_vision}

        ## User Stories
        {user_stories}

        ## Key Features Implemented
        {key_features}

        ## Pipeline Information
        - **State File**: {state_file_path}
        - **Implementation Plan**: {implementation_plan_path}
        - **Total Tasks**: {total_tasks}
        - **Request Range**: {first_request_id} through {last_request_id}

        ## Epic-Specific Testing Scenarios
        {epic_specific_scenarios}

        ## Instructions

        1. **Understand What Was Built**: Read state file to see completed tasks

        2. **Generate Use Cases** covering:

           **Happy Path Flows** (category: "happy-path")
           - Primary user journeys that should always work
           - End-to-end flows testing main features

           **Edge Cases** (category: "edge-case")
           - Boundary conditions
           - Error handling scenarios
           - Empty/null states

           **Epic-Specific Scenarios** (category: "feature-specific")
           - {epic_specific_scenarios}

        3. **Use Case Format**: Each use case MUST match this EXACT structure:
           ```json
           {{
             "id": "UC-001",
             "title": "Short descriptive title",
             "category": "happy-path",
             "priority": "P0",
             "description": "What this use case tests",
             "expectedOutcome": "What the final state should be after all steps",
             "steps": [
               {{
                 "step": 1,
                 "action": "What to do",
                 "component": "ComponentName or API/Database",
                 "expectedResult": "What should happen after this step"
               }}
             ]
           }}
           ```

           **Field requirements:**
           - `id`: Format "UC-XXX" (e.g., UC-001, UC-E1-001)
           - `category`: One of "happy-path", "error-handling", "edge-case", "integration"
           - `priority`: One of "P0" (critical), "P1" (important), "P2" (nice-to-have)
           - `steps`: Array with step number, action, component, and expectedResult
           - `expectedOutcome`: Single string describing final expected state

        4. **CRITICAL - Update State File**: You MUST add the `items` array to state:
           ```json
           {{
             "usecases": {{
               "generated": true,
               "generated_at": "<ISO timestamp>",
               "total_scenarios": <number>,
               "items": [
                 // REQUIRED: Array of use case objects matching the format above
                 // The test harness generator reads this array directly
                 // Without items array, test harness will have NO use cases
               ]
             }}
           }}
           ```

           **WARNING**: The orchestrator reads `state.usecases.items` to populate the
           test harness. If you only add metadata without the `items` array, the
           test harness "Use Case Tests" tab will be empty!

        5. **Test Harness Integration**: After you update the state file, the orchestrator
           automatically regenerates the test harness to include your use cases in the
           "Use Case Tests" tab. Users can then step through each use case interactively.

      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Edit,Bash,Glob,Grep"
        - "--dangerously-skip-permissions"
      timeout: 900  # 15 minutes

    output:
      type: usecases
      # Use cases stored in state file under 'usecases' key

# =============================================================================
# IMPLEMENTATION CONFIGURATION (For testcheck to know what tools to verify)
# =============================================================================
#
# Agent 00b should also add an 'implementation' section based on the tech stack:
#
# implementation:
#   technology:
#     database: supabase|postgres|mongodb|none
#     browser_testing: true|false
#     framework: nextjs|react|vue|etc
#
#   required_tools:
#     - supabase_mcp     # If database: supabase
#     - playwright_mcp   # If browser_testing: true
#
#   precheck:
#     timeout: 120
#     clear_next_cache: true  # For Next.js projects

# =============================================================================
# COMPLETE EXAMPLE
# =============================================================================
#
# Here's how all 7 stages should look in a complete pipeline YAML:
#
# request_stages:
#   # Stage 0: Precheck (runs FIRST, before any implementation)
#   - id: precheck
#     name: "Codebase Health Precheck"
#     mode: pipeline
#     run_before_tasks: true
#     applies_to: nextjs
#     ...
#
#   # Stage 1-4: Per-task stages
#   - id: request
#     ...
#   - id: overview
#     ...
#   - id: details
#     ...
#   - id: implementation
#     ...
#
#   # Stage 5-6: Pipeline-level stages (from this template)
#   - id: testcheck
#     name: "Test Check & Verification"
#     mode: pipeline
#     ...
#
#   - id: usecases
#     name: "Use Case Test Generation"
#     mode: pipeline
#     ...
#
# =============================================================================
# EXECUTION ORDER
# =============================================================================
#
# 1. PRECHECK (Stage 0) - Verify codebase health, establish baseline
#    └── If TypeScript errors in target modules → BLOCK pipeline
#
# 2. PER-TASK STAGES (Stages 1-4) - For each task in the pipeline:
#    └── request → overview → details → implementation
#
# 3. TESTCHECK (Stage 5) - Verify all implementations
#    └── Run after all tasks complete
#
# 4. USECASES (Stage 6) - Generate E2E test scenarios
#    └── Run after testcheck
