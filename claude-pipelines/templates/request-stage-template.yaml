# Template for request stage in pipeline YAMLs
# Agent 00b should use this format when generating pipeline configurations
# Last Modified: 2026-01-19

# This is the correct invocation_template for the request stage
# Uses 01p-request-fa-pipeline which REQUIRES explicit file path
# This ensures parallel pipelines use correct gen_requests files

request_stage_template:
  - id: request
    name: "Create Request"
    description: "Convert implementation task into formal requirement"
    enabled: true

    agent:
      name: "01p-request-fa-pipeline"
      invocation_template: |
        use agent 01p-request-fa-pipeline to create the request for: {full_task}

        CRITICAL: Target requests file is: {requests_file_path}

        IMPORTANT: Before creating the request:
        1. Read {requests_file_path} to find the HIGHEST existing REQ-XXX number
        2. Use the NEXT sequential number (e.g., if REQ-180 exists, use REQ-181)
        3. Format MUST be REQ-XXX (three digits minimum, e.g., REQ-181, not REQ-2)
        4. Append the new request to {requests_file_path}
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Bash"
      timeout: 240  # 4 minutes

    output:
      type: append
      file: "{requests_file_path}"
