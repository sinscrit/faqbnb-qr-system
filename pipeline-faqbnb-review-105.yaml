# =============================================================================
# Pipeline Configuration: FAQBNB Review Comprehensive Implementation (Plan-105)
# =============================================================================
#
# Generated: 2026-01-11 23:30:00 PST
# Last Modified: 2026-01-11 23:30:00 PST
# Source: ./docs/prd/Plan-105-FAQBNB-Review-2026-01-11-Comprehensive-Implementation.md
#
# This pipeline processes the FAQBNB Review Comprehensive implementation plan (Plan-105)
# through the agent workflow system. Plan-105 addresses 5 change requests:
# REQ-2 (Data Model UI Clarification), REQ-5 (Workflow Step Count),
# REQ-3 (What's Next Screen), REQ-1 (Dashboard Cards Clickable), REQ-4 (Navigation Menu).
#
# Usage:
#   python pipeline_orchestrator.py --config ./pipeline-faqbnb-review-105.yaml
#   python pipeline_orchestrator.py --config ./pipeline-faqbnb-review-105.yaml --dry-run
#   python pipeline_orchestrator.py --config ./pipeline-faqbnb-review-105.yaml --list-tasks
#   python pipeline_orchestrator.py --config ./pipeline-faqbnb-review-105.yaml --tasks "1,2,3"
#   python pipeline_orchestrator.py --config ./pipeline-faqbnb-review-105.yaml --stages "request,overview"
#
# =============================================================================

pipeline:
  name: faqbnb-review-105
  version: "1.0"
  description: "Process FAQBNB Review Comprehensive implementation plan (Plan-105: 5 change requests) through agent pipeline"

  # Pipeline mode:
  #   - "horizontal": All tasks through stage 1, then all through stage 2, etc.
  #   - "per_request": All stages for each task before moving to next task.
  #   - "hybrid": Stages 1-2 horizontal → dependency analysis → Stages 3-4 in dependency order
  mode: hybrid

  # Global default timeout for agent invocations (in seconds)
  default_timeout: 900  # 15 minutes

# =============================================================================
# Parallelization Configuration
# =============================================================================

parallelization:
  enabled: false
  max_concurrent: 3
  branch_pattern: "pipeline/{pipeline_name}/{cluster_id}"
  worktree_dir: "../.worktrees/{pipeline_name}/{cluster_id}"
  merge_strategy: "sequential"
  cleanup_worktrees: true
  on_merge_conflict: "pause_and_notify"

# =============================================================================
# Dependency Tracking Configuration
# =============================================================================

dependency_tracking:
  enabled: true

  extraction:
    section_pattern: "^## Dependencies"
    depends_on_pattern: "^### Depends On"
    blocks_pattern: "^### Blocks"
    parallel_safety_pattern: "^### Parallel Safety"
    task_ref_pattern: "Task\\s+(\\d+\\.\\d+)"
    files_touched_pattern: "Files touched:\\s*(.+)"

  state_schema:
    tasks: {}
    graph:
      nodes: []
      edges: []
      roots: []
      leaves: []
    execution:
      topological_order: []
      critical_path: []
      parallel_clusters: []

  validation:
    fail_on_cycles: true
    warn_on_no_dependencies: true
    warn_on_unknown_reference: true
    fail_on_missing_reference: false

  recompute_clusters:
    on_extraction: true
    on_mode_switch: true
    on_demand: true

# =============================================================================
# Source Document
# =============================================================================

source:
  path: ./docs/prd/Plan-105-FAQBNB-Review-2026-01-11-Comprehensive-Implementation.md

  extraction:
    # Pattern to match tasks like: #### Task 0.1: Update MetadataStep Labels and Help Text
    task_pattern: '^####\s+Task\s+(\d+\.\d+):\s+(.+?)$'
    task_groups:
      id: 1
      title: 2

    # Pattern to match phases like: ### Phase 0: REQ-2 - Data Model UI Clarification
    phase_pattern: '^###\s+Phase\s+(\d+):\s+(.+?)$'
    phase_groups:
      number: 1
      name: 2

    description:
      mode: following_bullets
      end_patterns:
        - '^####\s+Task'                 # Next task
        - '^###\s+Phase'                 # Next phase
        - '^##\s+'                       # Major section
        - '^---'                         # Section divider

# =============================================================================
# Output Locations
# =============================================================================

outputs:
  requests: ./docs/gen_requests.md
  overviews: ./docs/
  details: ./docs/
  state: ./pipeline-faqbnb-review-105-state.json
  logs: ./pipeline-faqbnb-review-105.log

# =============================================================================
# Request Stages (Per-Request Mode)
# =============================================================================

request_stages:
  # -------------------------------------------------------------------------
  # Stage 1: Create Request
  # -------------------------------------------------------------------------
  - id: request
    name: "Create Request"
    description: "Convert implementation task into formal requirement"
    enabled: true

    agent:
      name: "01-request-fa"
      invocation_template: |
        use agent 01-request-fa to create the request for: {full_task}

        IMPORTANT: Before creating the request:
        1. Read docs/gen_requests.md to find the HIGHEST existing REQ-XXX number
        2. Use the NEXT sequential number (e.g., if REQ-180 exists, use REQ-181)
        3. Format MUST be REQ-XXX (three digits minimum, e.g., REQ-181, not REQ-2)
        4. Append the new request to docs/gen_requests.md
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Bash"
      timeout: 240  # 4 minutes

    output:
      type: append
      file: ./docs/gen_requests.md

  # -------------------------------------------------------------------------
  # Stage 2: Create Overview
  # -------------------------------------------------------------------------
  - id: overview
    name: "Create Overview"
    description: "Pull relevant context from codebase for the request"
    enabled: true

    agent:
      name: "02-techlead-overview"
      invocation_template: |
        Acting as a Technical Lead, create an implementation breakdown document for:
        {requests_file_path} - Request #{request_id_num}

        **Implementation Plan Reference**: {implementation_plan_path}

        **Task Context**:
        - Phase: {phase} - {phase_name}
        - Task ID: {task_id}
        - Title: {task_title}
        - Details:
            {task_description_formatted}

        **Output file**: docs/{request_id}-{task_title_slug}-overview.md

        **Instructions**:
        1. Read the request from {requests_file_path} (find Request #{request_id_num})
        2. Read the implementation plan from {implementation_plan_path} for context on:
           - REQ-2 (Phase 0): Data model UI clarity - Item vs Article separation
           - REQ-5 (Phase 1): Workflow step count fix - 8 steps total, Save is final
           - REQ-3 (Phase 2): What's Next screen - 4 action menu (Edit/Add/New/Done)
           - REQ-1 (Phase 3): Dashboard cards clickable - navigation to list views
           - REQ-4 (Phase 4): Navigation menu - Instructions menu item, mobile labels
        3. Investigate the codebase for existing patterns:
           - ItemCapture workflow (ItemCapture.tsx, MetadataStep.tsx, ReviewStep.tsx)
           - Progress tracking (ProgressIndicator.tsx, ItemCapture.types.ts)
           - Dashboard components (UserDashboard.tsx, KPIDashboardOverview.tsx)
           - Navigation (RoleBasedNavigation.tsx, dashboard/layout.tsx)
           - Data model types (src/types/index.ts)
           - QR code generation (hooks/useQRCodeGeneration.ts)
        4. Create the overview document following the standard structure
        5. Include an "Authorized Files and Functions for Modification" section

        **CRITICAL: Dependency Analysis Section**
        You MUST include a "## Dependencies" section in the overview document with:

        ```markdown
        ## Dependencies

        ### Depends On (upstream)
        <!-- Tasks that MUST complete before this task can start -->
        - Task X.Y: [reason]

        ### Blocks (downstream)
        <!-- Tasks that cannot start until this task completes -->
        - Task A.B: [reason]

        ### Parallel Safety
        <!-- Can this task run in parallel with others? -->
        - Files touched: [list files this task modifies]
        - Conflicts with: [tasks that modify same files]
        - Safe to parallelize with: [tasks with no file overlap]
        ```

        Consider these known dependencies from the implementation plan:
        - Phase 0 (REQ-2) is CRITICAL - establishes Item vs Article terminology
        - Phase 1 (REQ-5) depends on Phase 0 - uses correct step terminology
        - Phase 2 (REQ-3) depends on Phase 0 & Phase 1 - WhatsNextStep uses correct model and step count
        - Phase 3 (REQ-1) is independent - dashboard cards can parallelize
        - Phase 4 (REQ-4) is independent - navigation menu can parallelize
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Bash"
      timeout: 660  # 11 minutes

    output:
      type: file
      directory: ./docs/
      filename: "{request_id}-{task_title_slug}-overview.md"

    post_stage:
      action: extract_dependencies

  # -------------------------------------------------------------------------
  # Stage 3: Create Detailed Task Breakdown
  # -------------------------------------------------------------------------
  - id: details
    name: "Create Detailed Tasks"
    description: "Break request into 1-point implementation tasks"
    enabled: true

    agent:
      name: "03-senior-dev-task-breakdown"
      invocation_template: |
        Create a detailed task breakdown document for Request #{request_id_num}

        **Input Documents** (you MUST read these first):
        - Overview document: {overview_file}
        - Requirements: {requests_file_path} (find Request #{request_id_num})
        - Implementation Plan: {implementation_plan_path}
        - Project README: README.md

        **Task Context**:
        - Phase: {phase} - {phase_name}
        - Task ID: {task_id}
        - Title: {task_title}

        **Output file**: docs/{request_id}-{task_title_slug}-detailed.md

        **Pre-Analysis Steps**:
        1. Read the overview document at {overview_file}
        2. Review README.md for project conventions
        3. Check existing component patterns
        4. Identify authorized files from the overview

        **Requirements**:
        - Each numbered task must be <= 1 story point
        - Include testing tasks for each implementation
        - Only modify files listed in the authorized section
        - Use actual system date/time in the document header (2026-01-11)
        - All file paths relative to project root
        - Include verification steps
        - Follow established patterns
        - For UI tasks: include accessibility verification (ARIA labels, keyboard nav)
        - For workflow tasks: include state management verification
        - For data model changes: ensure UI-only, no database schema changes
        - For WhatsNextStep creation: include complete React component with TypeScript interfaces
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Bash"
      timeout: 480  # 8 minutes

    output:
      type: file
      directory: ./docs/
      filename: "{request_id}-{task_title_slug}-detailed.md"

  # -------------------------------------------------------------------------
  # Stage 4: Implementation
  # -------------------------------------------------------------------------
  - id: implementation
    name: "Implementation"
    description: "Autonomously implement all tasks from the detailed specification"
    enabled: true

    agent:
      name: "04-spec-implementation"
      invocation_template: |
        Implement all tasks from the detailed specification for Request #{request_id_num}

        **Detailed Specification**: {details_file}

        **Task Context**:
        - Request ID: {request_id}
        - Phase: {phase} - {phase_name}
        - Task ID: {task_id}
        - Title: {task_title}

        {project_context}

        **Instructions**:
        1. Read the detailed specification at {details_file}
        2. Execute all tasks following the per-task workflow:
           - Implement -> Verify -> Update Doc -> Build -> Commit
        3. Mark completed tasks with [x] and add implementation notes
        4. Continue autonomously until all required tasks are complete
        5. Run verification: `npm run type-check` and `npm run build`
        6. Report final status with summary of completed/failed/blocked tasks
        7. **IMPORTANT**: End your response with a test summary in this format:
           ```
           TEST SUMMARY:
           - Type Check: PASSED/FAILED
           - Build: PASSED/FAILED
           - Tests: PASSED/FAILED (if tests were run)
           ```

        **Key Patterns to Follow**:
        - Next.js 15.5.9 with App Router patterns
        - Lucide React icons for UI consistency
        - Tailwind CSS v4 for styling
        - React Context/hooks for state management
        - Responsive design with Tailwind breakpoints (md:, lg:)
        - Component colocation patterns
        - TypeScript strict mode compliance
        - Radix UI primitives for accessible components

        **Special Considerations by Phase**:
        - Phase 0 (REQ-2 - Data Model UI Clarification):
          → UI labels only, NO database schema changes
          → Item Name = physical object identifier (e.g., "Steamer")
          → Article Title/Purpose = instruction type (e.g., "How to Clean")
          → QR code label = Item Name only (not "Purpose - Item Name")
          → Update MetadataStep.tsx: "Item Name" label with helper text
          → Update ReviewStep.tsx: Show "Item Name" not "Title"
          → Update ItemCapture.types.ts: JSDoc clarifies title = Item Name
          → Verify QR generation utilities use item name correctly

        - Phase 1 (REQ-5 - Workflow Step Count):
          → Current step counter shows "Step X of Y" somewhere in UI
          → Update total step count to 8 (Save Item is step 8)
          → Post-save screen (Item Saved! with QR code) is NOT numbered
          → Continue button leads to post-workflow menu (also not numbered)
          → Check ProgressIndicator.tsx or similar component

        - Phase 2 (REQ-3 - What's Next Screen):
          → Create new WhatsNextStep.tsx component
          → Remove Cancel button and back arrow from post-save menu
          → 4 clear action options with icons:
            • Edit Instructions (Edit icon)
            • Add New Instructions (PlusCircle icon) - PRIMARY variant
            • Create New Item (Package icon)
            • Done (text button)
          → Success header with CheckCircle icon
          → NO step indicator on this screen
          → Add 'whats-next' to WizardStep type
          → Update ItemCapture.tsx to transition to whats-next after save
          → Implement all 4 callback handlers

        - Phase 3 (REQ-1 - Dashboard Cards Clickable):
          → Update KPICard component to accept href/onClick props
          → Wrap card content in Link component when href provided
          → Add hover states: shadow-md, border-blue-300, cursor-pointer
          → Add focus states for accessibility
          → Wire up navigation:
            • Properties → /dashboard/properties
            • Items → /dashboard/items
            • Rooms (if exists) → /dashboard/rooms or tags filter
          → Update both UserDashboard.tsx and KPIDashboardOverview.tsx

        - Phase 4 (REQ-4 - Navigation Menu):
          → Update RoleBasedNavigation.tsx navigation items
          → Add NavigationItem interface property: mobileName (optional string)
          → Navigation items:
            • Dashboard: LayoutDashboard icon, mobileName: "D/B"
            • Items: Package icon, mobileName: "Items"
            • Instructions: FileText icon, mobileName: "Instr." (NEW)
            • Properties: Home icon, mobileName: "Prop."
          → Create /dashboard/instructions/page.tsx placeholder
          → Update dashboard layout navigation if needed
          → Add Instructions to DashboardSection enum/permissions
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Edit,Bash,Glob,Grep,mcp__playwright__*"
      timeout: 1800  # 30 minutes

    output:
      type: implementation


  # Stage 5: QA Validation
  - id: qa_validation
    name: "QA Validation"
    description: "Validate that implementation matches the detailed specification"
    enabled: true
    validates: implementation
    max_validation_retries: 1
    agent:
      name: "05-qa-validation"
      invocation_template: |
        Validate the implementation for Request #{request_id_num}

        **Detailed Specification**: {details_file}

        **Task Context**:
        - Request ID: {request_id}
        - Task ID: {task_id}
        - Title: {task_title}

        **Instructions**:
        1. Read the detailed specification at {details_file}
        2. For EACH subtask marked as complete ([x]):
           a. Verify the implementation matches what was specified
           b. Check the implementation note matches the actual code
           c. Verify the target files exist and contain the expected changes
        3. Run type check and build verification
        4. Output a QA Validation Report with:
           - **Status**: PASS or FAIL
           - Summary of subtasks checked
           - Detailed issues (if any) with specific fix instructions
        5. If issues found, format them clearly for the implementation agent to fix on retry
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Glob,Grep,Bash"
        - "--dangerously-skip-permissions"
      timeout: 1200
    output:
      type: validation
  # -------------------------------------------------------------------------
  # Stage 6: Test Verification & Harness Generation (Pipeline-Level)
  # -------------------------------------------------------------------------
  - id: testcheck
    name: "Test Verification"
    description: "Verify implementation against specs and create/deploy test harness"
    enabled: true
    mode: pipeline

    agent:
      name: "06a-pipeline-testcheck"
      invocation_template: |
        Execute the 06a-pipeline-testcheck agent for the pipeline.

        **Pipeline Config**: {pipeline_yaml_path}
        **State File**: {state_file_path}
        **Implementation Plan**: {implementation_plan_path}
        **Total Tasks**: {total_tasks}

        Follow the workflow defined in ~/.claude/agents/06a-pipeline-testcheck.md:

        **Phase 1: Discovery**
        - Read the pipeline YAML and state file
        - Collect all detailed spec files from docs/

        **Phase 2: Specification Analysis**
        - Parse each detailed spec to extract components, exports, types, use cases
        - Identify UI/UX changes across all 5 REQs (Plan-105)

        **Phase 3: Implementation Verification**
        - REQ-2 (Phase 0 - Data Model UI Clarification):
          → MetadataStep.tsx: "Item Name" field label with explanatory helper text
          → ReviewStep.tsx: Summary shows "Item Name" not "Title"
          → ItemCapture.types.ts: JSDoc clarifies title field = Item Name
          → QR code generation: Labels show Item Name only (verify in useQRCodeGeneration.ts)
          → Placeholder/error messages reference "Item name" correctly

        - REQ-5 (Phase 1 - Workflow Step Count):
          → Step counter displays "Step X of 8" (total 8 numbered steps)
          → "Save Item" is step 8 (final numbered step)
          → Post-save screen (Item Saved! with QR code) has NO step number
          → Continue button behavior correct
          → Check ProgressIndicator.tsx implementation

        - REQ-3 (Phase 2 - What's Next Screen):
          → WhatsNextStep.tsx component exists with proper TypeScript interfaces
          → No Cancel button on post-save screen
          → No back arrow on post-save screen
          → 4 menu options present with correct icons:
            • Edit Instructions (Edit)
            • Add New Instructions (PlusCircle, primary variant)
            • Create New Item (Package)
            • Done (text button)
          → Success header with CheckCircle icon
          → No step indicator visible
          → All 4 callback handlers implemented
          → 'whats-next' added to WizardStep type

        - REQ-1 (Phase 3 - Dashboard Cards Clickable):
          → KPICard component accepts href/onClick props
          → Cards use Link wrapper for navigation
          → Hover states: shadow-md, border changes, cursor-pointer
          → Focus states: visible focus ring
          → Navigation targets correct:
            • Properties → /dashboard/properties
            • Items → /dashboard/items
          → Both UserDashboard and KPIDashboardOverview updated

        - REQ-4 (Phase 4 - Navigation Menu):
          → Dashboard icon is LayoutDashboard (grid icon, NOT Home)
          → Instructions menu item exists with FileText icon
          → Mobile labels implemented:
            • Dashboard: "D/B"
            • Items: "Items"
            • Instructions: "Instr."
            • Properties: "Prop."
          → Instructions page exists at /dashboard/instructions
          → NavigationItem interface has mobileName property
          → Instructions added to permissions/DashboardSection

        - Check types match specs
        - Record any discrepancies

        **Phase 4: Test Harness Generation**
        - Create/update test harness page at /src/app/test/faqbnb-review-105/page.tsx
          → Access at: http://localhost:3000/test/faqbnb-review-105
        - Add test scenarios for all 5 change requests
        - Update test index at /src/app/test/page.tsx
          → Access at: http://localhost:3000/test

        **Phase 5: Build & Deploy**
        - Run npm run build to verify no compilation errors
        - Deploy to Railway (after user confirmation)
        - Verify deployed URL is accessible

        **Phase 6: State Update**
        - Update state file with verification results

        Report findings including discrepancies, test harness status, build status, and deployed URL.
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Edit,Bash,Glob,Grep,WebFetch"
      timeout: 900  # 15 minutes

    output:
      type: verification

  # -------------------------------------------------------------------------
  # Stage 7: Use Case Test Generation (Pipeline-Level)
  # -------------------------------------------------------------------------
  - id: usecases
    name: "Use Case Generation"
    description: "Generate aggregate end-to-end test scenarios from PRD intent"
    enabled: true
    mode: pipeline

    agent:
      name: "06b-usecase-generator"
      invocation_template: |
        Execute the 06b-usecase-generator agent for the pipeline.

        **Pipeline Config**: {pipeline_yaml_path}
        **State File**: {state_file_path}
        **PRD/Implementation Plan**: {implementation_plan_path}
        **Total Tasks**: {total_tasks}

        Follow the workflow defined in ~/.claude/agents/06b-usecase-generator.md:

        **Phase 1: Intent Discovery**
        - Read the Implementation Plan at {implementation_plan_path}
        - Extract user goals, UI/UX improvements, success criteria
        - Identify use case categories: happy-path, error-handling, edge-case

        **Phase 2: Component Mapping**
        - Read the pipeline state to understand implemented components
        - Map PRD intent to implemented components
        - Identify integration points across the 5 REQs

        **Phase 3: Use Case Generation**
        - Generate comprehensive use cases from Implementation Plan (1-3 per REQ)
        - Include steps, expected outcomes, components involved
        - Prioritize: P0 (critical paths), P1 (error scenarios), P2 (edge cases)
        - Focus on:
          - REQ-2: Item vs Article terminology clarity throughout workflow
          - REQ-5: Workflow step count display (8 numbered steps total)
          - REQ-3: Post-workflow menu (4 action cards, no Cancel/Back)
          - REQ-1: Dashboard card navigation flow (clickable cards)
          - REQ-4: Navigation menu and Instructions page access

        - Cross-REQ integration scenarios:
          - Complete item creation workflow: Metadata → Capture → Review → Save → WhatsNextStep (REQ-2, REQ-5, REQ-3)
          - Dashboard navigation: Card click → List view (REQ-1)
          - Mobile navigation: Abbreviated labels displayed correctly (REQ-4)
          - QR code generation: Item Name displayed correctly (REQ-2)
          - Post-workflow actions: Edit/Add/New/Done all functional (REQ-3)

        **Phase 4: Test Page Update**
        - Update the pipeline test harness at /src/app/test/faqbnb-review-105/page.tsx
          → Access at: http://localhost:3000/test/faqbnb-review-105
        - Add "FAQBNB Review Use Cases (Plan-105)" section with interactive test guides
        - Each use case as a clickable card with step-by-step instructions

        **Phase 5: Documentation Update**
        - Update state file with use case metadata
        - Log summary of generated use cases

        Generate comprehensive use cases that validate the FAQBNB review changes work cohesively.
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Edit,Bash,Glob,Grep"
      timeout: 600  # 10 minutes

    output:
      type: usecases

# =============================================================================
# Implementation Configuration
# =============================================================================

implementation:
  technology:
    database: supabase
    browser_testing: true

  required_tools:
    - playwright_mcp

  precheck:
    timeout: 120

# =============================================================================
# Retry Configuration
# =============================================================================

retry:
  max_attempts: 2
  on_failure: skip_and_log

# =============================================================================
# Legacy Stages (Horizontal Mode - Not Used in hybrid mode)
# =============================================================================

stages:
  - id: request
    name: "Request Generation"
    enabled: false
    agent:
      name: "01-request-fa"
      invocation_template: "use agent 01-request-fa to create the request for: {full_task}"
      command:
        - "claude"
        - "-p"
        - "{prompt}"
    retry:
      max_attempts: 2
      on_failure: skip_and_log
    stop_hook: false

# =============================================================================
# Expected Task Dependencies (Plan-105)
# =============================================================================
#
# Phase 0: REQ-2 - Data Model UI Clarification (CRITICAL)
#   - Task 0.1: Update MetadataStep Labels and Help Text
#   - Task 0.2: Update ReviewStep to Show Correct Labels
#   - Task 0.3: Add Article Purpose Field (Future Enhancement - DEFERRED)
#   - Task 0.4: Update QR Code Label Display
#   Files: MetadataStep.tsx, ReviewStep.tsx, ItemCapture.types.ts, useQRCodeGeneration.ts
#
# Phase 1: REQ-5 - Fix Workflow Step Count (HIGH)
#   - Task 1.1: Update Progress Stages Constant
#   - Task 1.2: Ensure Save Is Final Step
#   - Task 1.3: Update Step Count in Mobile View
#   Files: ProgressIndicator.tsx, ItemCapture.tsx
#   Depends on: Phase 0 (uses correct terminology)
#
# Phase 2: REQ-3 - What's Next Screen (HIGH)
#   - Task 2.1: Create WhatsNextStep Component
#   - Task 2.2: Add WhatsNextStep to Wizard Types
#   - Task 2.3: Integrate WhatsNextStep into ItemCapture Flow
#   - Task 2.4: Ensure No Navigation Controls on WhatsNextStep
#   Files: WhatsNextStep.tsx (NEW), ItemCapture.types.ts, ItemCapture.tsx, ProgressIndicator.tsx
#   Depends on: Phase 0, Phase 1 (uses correct model and step count)
#
# Phase 3: REQ-1 - Dashboard Cards Clickable (HIGH)
#   - Task 3.1: Update KPIDashboardOverview Cards
#   - Task 3.2: Wire Up Navigation Links
#   - Task 3.3: Update UserDashboard Cards
#   - Task 3.4: Add Visual Feedback for Clickable Cards
#   Files: KPIDashboardOverview.tsx, UserDashboard.tsx
#   Independent - can parallelize
#
# Phase 4: REQ-4 - Navigation Menu Update (MEDIUM)
#   - Task 4.1: Update Navigation Items Configuration
#   - Task 4.2: Add Mobile Label Support
#   - Task 4.3: Update Dashboard Layout Navigation
#   - Task 4.4: Create Instructions Page (Placeholder)
#   Files: RoleBasedNavigation.tsx, layout.tsx, instructions/page.tsx (NEW), permissions.ts
#   Independent - can parallelize
#
# Dependency Order:
#   1. Phase 0 (CRITICAL - REQ-2: Data Model UI foundation)
#   2. Phase 1 (REQ-5: Depends on Phase 0 for terminology)
#   3. Phase 2 (REQ-3: Depends on Phase 0 & Phase 1)
#   4. Phase 3 (REQ-1: Independent, parallel-safe)
#   5. Phase 4 (REQ-4: Independent, parallel-safe)
#
# Total Estimated Effort: 14-21 hours
# Total Tasks: 18 tasks across 5 phases (0-4)
#
# =============================================================================
