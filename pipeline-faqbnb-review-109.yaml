# =============================================================================
# Pipeline Configuration: FAQBNB Review Complete Implementation (Plan-109)
# =============================================================================
#
# Generated: 2026-01-12 14:30:00 PST
# Last Modified: 2026-01-12 14:30:00 PST
# Source: ./docs/prd/Plan-109-FAQBNB-Review-2026-01-11b-Complete-Implementation.md
#
# This pipeline processes the FAQBNB Review Complete implementation plan (Plan-109)
# through the agent workflow system. Plan-109 addresses 5 items from the FAQBNB
# Application Review session (2026-01-11):
# - ITEM-01: Making dashboard statistics cards clickable with navigation
# - ITEM-02: Fixing the data model to properly separate Items from Articles/Instructions
# - ITEM-03: Redesigning the "What's Next" screen as a post-workflow menu with 4 clear options
# - ITEM-04: Updating navigation menu structure with new labels and icons
# - ITEM-05: Fixing workflow step count from "10 steps" to "8 steps"
#
# Usage:
#   python pipeline_orchestrator.py --config ./pipeline-faqbnb-review-109.yaml
#   python pipeline_orchestrator.py --config ./pipeline-faqbnb-review-109.yaml --dry-run
#   python pipeline_orchestrator.py --config ./pipeline-faqbnb-review-109.yaml --list-tasks
#   python pipeline_orchestrator.py --config ./pipeline-faqbnb-review-109.yaml --tasks "1,2,3"
#   python pipeline_orchestrator.py --config ./pipeline-faqbnb-review-109.yaml --stages "request,overview"
#
# =============================================================================

pipeline:
  name: faqbnb-review-109
  version: "1.0"
  description: "Process FAQBNB Review Complete implementation plan (Plan-109: 5 items from review session) through agent pipeline"

  # Pipeline mode:
  #   - "horizontal": All tasks through stage 1, then all through stage 2, etc.
  #   - "per_request": All stages for each task before moving to next task.
  #   - "hybrid": Stages 1-2 horizontal → dependency analysis → Stages 3-4 in dependency order
  mode: hybrid

  # Global default timeout for agent invocations (in seconds)
  default_timeout: 900  # 15 minutes

# =============================================================================
# Parallelization Configuration
# =============================================================================

parallelization:
  enabled: false
  max_concurrent: 3
  branch_pattern: "pipeline/{pipeline_name}/{cluster_id}"
  worktree_dir: "../.worktrees/{pipeline_name}/{cluster_id}"
  merge_strategy: "sequential"
  cleanup_worktrees: true
  on_merge_conflict: "pause_and_notify"

# =============================================================================
# Dependency Tracking Configuration
# =============================================================================

dependency_tracking:
  enabled: true

  extraction:
    section_pattern: "^## Dependencies"
    depends_on_pattern: "^### Depends On"
    blocks_pattern: "^### Blocks"
    parallel_safety_pattern: "^### Parallel Safety"
    task_ref_pattern: "Task\\s+(\\d+\\.\\d+)"
    files_touched_pattern: "Files touched:\\s*(.+)"

  state_schema:
    tasks: {}
    graph:
      nodes: []
      edges: []
      roots: []
      leaves: []
    execution:
      topological_order: []
      critical_path: []
      parallel_clusters: []

  validation:
    fail_on_cycles: true
    warn_on_no_dependencies: true
    warn_on_unknown_reference: true
    fail_on_missing_reference: false

  recompute_clusters:
    on_extraction: true
    on_mode_switch: true
    on_demand: true

# =============================================================================
# Source Document
# =============================================================================

source:
  path: ./docs/prd/Plan-109-FAQBNB-Review-2026-01-11b-Complete-Implementation.md

  extraction:
    # Pattern to match tasks like: #### Task 1.1: Update WORKFLOW_STEPS constant
    task_pattern: '^####\s+Task\s+(\d+\.\d+):\s+(.+?)$'
    task_groups:
      id: 1
      title: 2

    # Pattern to match phases like: ### Phase 1: Fix Workflow Step Count (ITEM-05) - HIGH Priority
    phase_pattern: '^###\s+Phase\s+(\d+):\s+(.+?)$'
    phase_groups:
      number: 1
      name: 2

    description:
      mode: following_bullets
      end_patterns:
        - '^####\s+Task'                 # Next task
        - '^###\s+Phase'                 # Next phase
        - '^##\s+'                       # Major section
        - '^---'                         # Section divider
        - '^\-\s+\[\s+\]'                # Checklist items

# =============================================================================
# Output Locations
# =============================================================================

outputs:
  requests: ./docs/gen_requests.md
  overviews: ./docs/
  details: ./docs/
  state: ./pipeline-faqbnb-review-109-state.json
  logs: ./pipeline-faqbnb-review-109.log

# =============================================================================
# Request Stages (Per-Request Mode)
# =============================================================================

request_stages:
  # -------------------------------------------------------------------------
  # Stage 1: Create Request
  # -------------------------------------------------------------------------
  - id: request
    name: "Create Request"
    description: "Convert implementation task into formal requirement"
    enabled: true

    agent:
      name: "01-request-fa"
      invocation_template: |
        use agent 01-request-fa to create the request for: {full_task}

        IMPORTANT: Before creating the request:
        1. Read docs/gen_requests.md to find the HIGHEST existing REQ-XXX number
        2. Use the NEXT sequential number (e.g., if REQ-180 exists, use REQ-181)
        3. Format MUST be REQ-XXX (three digits minimum, e.g., REQ-181, not REQ-2)
        4. Append the new request to docs/gen_requests.md
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Bash"
      timeout: 240  # 4 minutes

    output:
      type: append
      file: ./docs/gen_requests.md

  # -------------------------------------------------------------------------
  # Stage 2: Create Overview
  # -------------------------------------------------------------------------
  - id: overview
    name: "Create Overview"
    description: "Pull relevant context from codebase for the request"
    enabled: true

    agent:
      name: "02-techlead-overview"
      invocation_template: |
        Acting as a Technical Lead, create an implementation breakdown document for:
        {requests_file_path} - Request #{request_id_num}

        **Implementation Plan Reference**: {implementation_plan_path}

        **Task Context**:
        - Phase: {phase} - {phase_name}
        - Task ID: {task_id}
        - Title: {task_title}
        - Details:
            {task_description_formatted}

        **Output file**: docs/{request_id}-{task_title_slug}-overview.md

        **Instructions**:
        1. Read the request from {requests_file_path} (find Request #{request_id_num})
        2. Read the implementation plan from {implementation_plan_path} for context on:
           - ITEM-05 (Phase 1): Workflow step count fix - 8 numbered steps, Save is final
           - ITEM-03 (Phase 2): What's Next screen - 4 action menu (Edit/Add/New/Done)
           - ITEM-01 (Phase 3): Dashboard cards clickable - navigation to list views
           - ITEM-04 (Phase 4): Navigation menu - Instructions menu item, mobile labels
           - ITEM-02 (Phase 5): Data model separation - Item vs Article/Instruction clarity
        3. Investigate the codebase for existing patterns:
           - ItemCreationWorkflow (ItemCreationWorkflow.tsx, utils/constants.ts)
           - Workflow steps (NextActionStep.tsx, PreviewSaveStep.tsx)
           - Progress tracking (WorkflowHeader.tsx, useWorkflowState.ts)
           - Dashboard components (SimpleDashboard/StatisticsCards.tsx)
           - Navigation (dashboard2/layout.tsx)
           - Data model types (ItemCreationWorkflow.types.ts)
           - QR code generation (hooks/useSessionQRGeneration.ts)
        4. Create the overview document following the standard structure
        5. Include an "Authorized Files and Functions for Modification" section

        **CRITICAL: Dependency Analysis Section**
        You MUST include a "## Dependencies" section in the overview document with:

        ```markdown
        ## Dependencies

        ### Depends On (upstream)
        <!-- Tasks that MUST complete before this task can start -->
        - Task X.Y: [reason]

        ### Blocks (downstream)
        <!-- Tasks that cannot start until this task completes -->
        - Task A.B: [reason]

        ### Parallel Safety
        <!-- Can this task run in parallel with others? -->
        - Files touched: [list files this task modifies]
        - Conflicts with: [tasks that modify same files]
        - Safe to parallelize with: [tasks with no file overlap]
        ```

        Consider these known dependencies from the implementation plan:
        - Phase 1 (ITEM-05): High priority - establishes correct step count (8 steps)
        - Phase 2 (ITEM-03): Depends on Phase 1 - What's Next uses correct step terminology
        - Phase 3 (ITEM-01): Independent - dashboard cards can parallelize
        - Phase 4 (ITEM-04): Independent - navigation menu can parallelize
        - Phase 5 (ITEM-02): Critical but UI-only - type definitions and display labels
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Bash"
      timeout: 660  # 11 minutes

    output:
      type: file
      directory: ./docs/
      filename: "{request_id}-{task_title_slug}-overview.md"

    post_stage:
      action: extract_dependencies

  # -------------------------------------------------------------------------
  # Stage 3: Create Detailed Task Breakdown
  # -------------------------------------------------------------------------
  - id: details
    name: "Create Detailed Tasks"
    description: "Break request into 1-point implementation tasks"
    enabled: true

    agent:
      name: "03-senior-dev-task-breakdown"
      invocation_template: |
        Create a detailed task breakdown document for Request #{request_id_num}

        **Input Documents** (you MUST read these first):
        - Overview document: {overview_file}
        - Requirements: {requests_file_path} (find Request #{request_id_num})
        - Implementation Plan: {implementation_plan_path}
        - Project README: README.md

        **Task Context**:
        - Phase: {phase} - {phase_name}
        - Task ID: {task_id}
        - Title: {task_title}

        **Output file**: docs/{request_id}-{task_title_slug}-detailed.md

        **Pre-Analysis Steps**:
        1. Read the overview document at {overview_file}
        2. Review README.md for project conventions
        3. Check existing component patterns
        4. Identify authorized files from the overview

        **Requirements**:
        - Each numbered task must be <= 1 story point
        - Include testing tasks for each implementation
        - Only modify files listed in the authorized section
        - Use actual system date/time in the document header (2026-01-12)
        - All file paths relative to project root
        - Include verification steps
        - Follow established patterns
        - For UI tasks: include accessibility verification (ARIA labels, keyboard nav)
        - For workflow tasks: include state management verification
        - For data model changes: ensure UI-only, no database schema changes
        - For component creation: include complete React component with TypeScript interfaces
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Bash"
      timeout: 480  # 8 minutes

    output:
      type: file
      directory: ./docs/
      filename: "{request_id}-{task_title_slug}-detailed.md"

  # -------------------------------------------------------------------------
  # Stage 4: Implementation
  # -------------------------------------------------------------------------
  - id: implementation
    name: "Implementation"
    description: "Autonomously implement all tasks from the detailed specification"
    enabled: true

    agent:
      name: "05-spec-implementation"
      invocation_template: |
        Implement all tasks from the detailed specification for Request #{request_id_num}

        **Detailed Specification**: {details_file}

        **Task Context**:
        - Request ID: {request_id}
        - Phase: {phase} - {phase_name}
        - Task ID: {task_id}
        - Title: {task_title}

        {project_context}

        **Instructions**:
        1. Read the detailed specification at {details_file}
        2. Execute all tasks following the per-task workflow:
           - Implement -> Verify -> Update Doc -> Build -> Commit
        3. Mark completed tasks with [x] and add implementation notes
        4. Continue autonomously until all required tasks are complete
        5. Run verification: `npm run type-check` and `npm run build`
        6. Report final status with summary of completed/failed/blocked tasks
        7. **IMPORTANT**: End your response with a test summary in this format:
           ```
           TEST SUMMARY:
           - Type Check: PASSED/FAILED
           - Build: PASSED/FAILED
           - Tests: PASSED/FAILED (if tests were run)
           ```

        **Key Patterns to Follow**:
        - Next.js 15.x with App Router patterns
        - Lucide React icons for UI consistency
        - Tailwind CSS v4 for styling
        - React Context/hooks for state management
        - Responsive design with Tailwind breakpoints (md:, lg:)
        - Component colocation patterns
        - TypeScript strict mode compliance
        - Radix UI primitives for accessible components

        **Special Considerations by Phase**:
        - Phase 1 (ITEM-05 - Workflow Step Count):
          → Create USER_VISIBLE_STEPS constant (8 steps) and POST_WORKFLOW_SCREENS constant
          → Update WORKFLOW_STEPS to combine both
          → Update PROGRESS_WEIGHTS to reach 100% at 'preview-save'
          → Add showStepCounter prop to WorkflowHeader
          → Update ItemCreationWorkflow to hide step counter on post-workflow screens
          → Update useWorkflowState hook with new computed values
          → Verify "Step 8 of 8" displays on Save Item step
          → Verify post-workflow screens (next-action, session-summary) have no step counter

        - Phase 2 (ITEM-03 - What's Next Screen):
          → Refactor NextActionStep component with 4 action options
          → Remove Cancel button (item already saved)
          → Add: Edit Instructions, Add New Instructions (primary), Create New Item, Done
          → Remove back arrow from post-workflow header
          → Integrate existing WhatsNextStep component if applicable
          → Ensure no step counter reference
          → Implement all 4 callback handlers

        - Phase 3 (ITEM-01 - Dashboard Cards Clickable):
          → Update StatisticsCards component to accept href prop
          → Add StatCardConfig interface with href field
          → Make StatCard a Link component with navigation
          → Add hover states: shadow-md, bg-gray-50, cursor-pointer
          → Add focus states: focus:ring-2, focus:ring-[#FF385C]
          → Add chevron indicator for clickability
          → Wire up navigation: Items → /dashboard2/items, Rooms/Tags → placeholders
          → Create rooms and tags route placeholders if needed

        - Phase 4 (ITEM-04 - Navigation Menu):
          → Update navigationItems in dashboard2/layout.tsx
          → Change Dashboard icon from Home to LayoutDashboard
          → Add mobileLabel property to navigation items
          → New structure: Dashboard (D/B), Items, Instructions (Instr.), Properties (Prop.)
          → Add mobile label display logic with CSS classes
          → Create Instructions page at /dashboard2/instructions/page.tsx
          → Ensure responsive label switching at md: breakpoint

        - Phase 5 (ITEM-02 - Data Model Separation):
          → Add Article interface to ItemCreationWorkflow.types.ts
          → Update SessionItem with articles array
          → Update CurrentItemState with currentArticle object
          → Update PreviewSaveStep to show correct labels: "Item Name" vs "Article Title"
          → Ensure QR code generation uses item name only (not article title)
          → UI-only changes - NO database schema modifications
          → Keep legacy fields for compatibility
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Edit,Bash,Glob,Grep,mcp__playwright__*"
      timeout: 1800  # 30 minutes

    output:
      type: implementation

  # -------------------------------------------------------------------------
  # Stage 5: Test Verification & Harness Generation (Pipeline-Level)
  # -------------------------------------------------------------------------
  - id: testcheck
    name: "Test Verification"
    description: "Verify implementation against specs and create/deploy test harness"
    enabled: true
    mode: pipeline

    agent:
      name: "06a-pipeline-testcheck"
      invocation_template: |
        Execute the 06a-pipeline-testcheck agent for the pipeline.

        **Pipeline Config**: {pipeline_yaml_path}
        **State File**: {state_file_path}
        **Implementation Plan**: {implementation_plan_path}
        **Total Tasks**: {total_tasks}

        Follow the workflow defined in ~/.claude/agents/06a-pipeline-testcheck.md:

        **Phase 1: Discovery**
        - Read the pipeline YAML and state file
        - Collect all detailed spec files from docs/

        **Phase 2: Specification Analysis**
        - Parse each detailed spec to extract components, exports, types, use cases
        - Identify UI/UX changes across all 5 items (Plan-109)

        **Phase 3: Implementation Verification**
        - ITEM-05 (Phase 1 - Workflow Step Count):
          → USER_VISIBLE_STEPS constant exists with 8 steps
          → POST_WORKFLOW_SCREENS constant exists
          → WORKFLOW_STEPS combines both constants
          → PROGRESS_WEIGHTS reaches 100% at 'preview-save'
          → WorkflowHeader has showStepCounter prop
          → ItemCreationWorkflow hides step counter on post-workflow
          → "Step 8 of 8" displays on Save Item
          → Post-workflow screens have no step counter

        - ITEM-03 (Phase 2 - What's Next Screen):
          → NextActionStep has 4 action options
          → No Cancel button present
          → Action options: Edit Instructions, Add New Instructions, Create New Item, Done
          → No back arrow on post-workflow screens
          → All 4 callback handlers implemented
          → No step counter visible

        - ITEM-01 (Phase 3 - Dashboard Cards Clickable):
          → StatisticsCards accepts href configuration
          → StatCard uses Link component
          → Hover states: shadow-md, bg-gray-50, cursor-pointer
          → Focus states: focus:ring-2 with Airbnb red
          → Chevron indicator present
          → Navigation targets correct: Items, Rooms, Tags
          → Rooms/Tags placeholder routes exist

        - ITEM-04 (Phase 4 - Navigation Menu):
          → Dashboard icon is LayoutDashboard (not Home)
          → Instructions menu item exists with FileText icon
          → Mobile labels implemented: D/B, Items, Instr., Prop.
          → Mobile label display logic with CSS responsive classes
          → Instructions page exists at /dashboard2/instructions
          → mobileLabel property in navigation items

        - ITEM-02 (Phase 5 - Data Model Separation):
          → Article interface exists in types
          → SessionItem has articles array
          → CurrentItemState has currentArticle object
          → PreviewSaveStep shows "Item Name" and "Article Title" correctly
          → QR code generation uses item name only
          → Legacy fields present for compatibility
          → NO database schema changes

        - Check types match specs
        - Record any discrepancies

        **Phase 4: Test Harness Generation**
        - Create/update test harness page at /src/app/test/faqbnb-review-109/page.tsx
          → Access at: http://localhost:3000/test/faqbnb-review-109
        - Add test scenarios for all 5 items
        - Update test index at /src/app/test/page.tsx
          → Access at: http://localhost:3000/test

        **Phase 5: Build & Deploy**
        - Run npm run build to verify no compilation errors
        - Deploy to Railway (after user confirmation)
        - Verify deployed URL is accessible

        **Phase 6: State Update**
        - Update state file with verification results

        Report findings including discrepancies, test harness status, build status, and deployed URL.
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Edit,Bash,Glob,Grep,WebFetch"
      timeout: 900  # 15 minutes

    output:
      type: verification

  # -------------------------------------------------------------------------
  # Stage 6: Use Case Test Generation (Pipeline-Level)
  # -------------------------------------------------------------------------
  - id: usecases
    name: "Use Case Generation"
    description: "Generate aggregate end-to-end test scenarios from PRD intent"
    enabled: true
    mode: pipeline

    agent:
      name: "06b-usecase-generator"
      invocation_template: |
        Execute the 06b-usecase-generator agent for the pipeline.

        **Pipeline Config**: {pipeline_yaml_path}
        **State File**: {state_file_path}
        **PRD/Implementation Plan**: {implementation_plan_path}
        **Total Tasks**: {total_tasks}

        Follow the workflow defined in ~/.claude/agents/06b-usecase-generator.md:

        **Phase 1: Intent Discovery**
        - Read the Implementation Plan at {implementation_plan_path}
        - Extract user goals, UI/UX improvements, success criteria
        - Identify use case categories: happy-path, error-handling, edge-case

        **Phase 2: Component Mapping**
        - Read the pipeline state to understand implemented components
        - Map PRD intent to implemented components
        - Identify integration points across the 5 items

        **Phase 3: Use Case Generation**
        - Generate comprehensive use cases from Implementation Plan (1-3 per item)
        - Include steps, expected outcomes, components involved
        - Prioritize: P0 (critical paths), P1 (error scenarios), P2 (edge cases)
        - Focus on:
          - ITEM-05: Workflow step count display (8 numbered steps total)
          - ITEM-03: Post-workflow menu (4 action cards, no Cancel/Back)
          - ITEM-01: Dashboard card navigation flow (clickable cards)
          - ITEM-04: Navigation menu and Instructions page access
          - ITEM-02: Item vs Article terminology clarity throughout workflow

        - Cross-item integration scenarios:
          - Complete item creation workflow: Steps → Save → WhatsNext (ITEM-05, ITEM-03)
          - Dashboard navigation: Card click → List view (ITEM-01)
          - Mobile navigation: Abbreviated labels displayed correctly (ITEM-04)
          - QR code generation: Item Name displayed correctly (ITEM-02)
          - Post-workflow actions: Edit/Add/New/Done all functional (ITEM-03)

        **Phase 4: Test Page Update**
        - Update the pipeline test harness at /src/app/test/faqbnb-review-109/page.tsx
          → Access at: http://localhost:3000/test/faqbnb-review-109
        - Add "FAQBNB Review Use Cases (Plan-109)" section with interactive test guides
        - Each use case as a clickable card with step-by-step instructions

        **Phase 5: Documentation Update**
        - Update state file with use case metadata
        - Log summary of generated use cases

        Generate comprehensive use cases that validate the FAQBNB review changes work cohesively.
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Edit,Bash,Glob,Grep"
      timeout: 600  # 10 minutes

    output:
      type: usecases

# =============================================================================
# Implementation Configuration
# =============================================================================

implementation:
  technology:
    database: supabase
    browser_testing: true

  required_tools:
    - playwright_mcp

  precheck:
    timeout: 120

# =============================================================================
# Retry Configuration
# =============================================================================

retry:
  max_attempts: 2
  on_failure: skip_and_log

# =============================================================================
# Legacy Stages (Horizontal Mode - Not Used in hybrid mode)
# =============================================================================

stages:
  - id: request
    name: "Request Generation"
    enabled: false
    agent:
      name: "01-request-fa"
      invocation_template: "use agent 01-request-fa to create the request for: {full_task}"
      command:
        - "claude"
        - "-p"
        - "{prompt}"
    retry:
      max_attempts: 2
      on_failure: skip_and_log
    stop_hook: false

# =============================================================================
# Expected Task Dependencies (Plan-109)
# =============================================================================
#
# Phase 1: ITEM-05 - Fix Workflow Step Count (HIGH Priority)
#   - Task 1.1: Update WORKFLOW_STEPS constant
#   - Task 1.2: Update PROGRESS_WEIGHTS
#   - Task 1.3: Update WorkflowHeader to hide on post-workflow screens
#   - Task 1.4: Update ItemCreationWorkflow to use USER_VISIBLE_STEPS
#   - Task 1.5: Update useWorkflowState hook
#   Files: utils/constants.ts, WorkflowHeader.tsx, ItemCreationWorkflow.tsx, useWorkflowState.ts
#
# Phase 2: ITEM-03 - Fix "What's Next" Screen (HIGH Priority)
#   - Task 2.1: Update NextActionStep component
#   - Task 2.2: Remove back arrow from post-workflow header
#   Files: NextActionStep.tsx, WorkflowHeader.tsx, WhatsNextStep.tsx (reference)
#   Depends on: Phase 1 (uses correct step count)
#
# Phase 3: ITEM-01 - Make Dashboard Cards Clickable (HIGH Priority)
#   - Task 3.1: Update StatisticsCards component
#   - Task 3.2: Create placeholder routes for Rooms and Tags
#   Files: SimpleDashboard/StatisticsCards.tsx, dashboard2/rooms/page.tsx, dashboard2/tags/page.tsx
#   Independent - can parallelize
#
# Phase 4: ITEM-04 - Update Navigation Menu (MEDIUM Priority)
#   - Task 4.1: Update navigationItems in layout
#   - Task 4.2: Add mobile label display logic
#   - Task 4.3: Create Instructions page
#   Files: dashboard2/layout.tsx, dashboard2/instructions/page.tsx
#   Independent - can parallelize
#
# Phase 5: ITEM-02 - Fix Data Model - Separate Item from Article (CRITICAL Priority)
#   - Task 5.1: Update type definitions
#   - Task 5.2: Update CurrentItemState
#   - Task 5.3: Update PreviewSaveStep display
#   - Task 5.4: Update QR code generation
#   Files: ItemCreationWorkflow.types.ts, PreviewSaveStep.tsx, dashboard2/create/page.tsx
#   Can parallelize (UI-only changes)
#
# Dependency Order:
#   1. Phase 1 (ITEM-05: Step count foundation)
#   2. Phase 2 (ITEM-03: Depends on Phase 1 for correct step display)
#   3. Parallel: Phase 3 (ITEM-01), Phase 4 (ITEM-04), Phase 5 (ITEM-02) - independent
#
# Total Estimated Effort: 10-16 hours
# Total Tasks: ~15 tasks across 5 phases (1-5)
#
# =============================================================================
