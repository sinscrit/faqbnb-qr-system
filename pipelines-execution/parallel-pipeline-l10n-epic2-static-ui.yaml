# =============================================================================
# Pipeline Configuration: Localization Epic 2 - Static UI Translation
# =============================================================================
#
# Generated: 2026-01-17 23:15:00 UTC
# Source: ./docs/prd/Plan-111-L10N-Epic2-Static-UI-Translation.md
#
# This pipeline processes the Localization Epic 2 - Static UI Translation
# implementation plan through the automated agent workflow
# (request → overview → details → implementation).
#
# Epic Overview:
#   - Scope: Extract ~3,200 UI strings from 275+ React components
#   - Languages: 6 (en, fr, es, de, nl, it)
#   - Sub-Epics: 10 feature areas
#   - Total Translation Entries: ~19,200
#
# Usage:
#   python claude-pipelines/pipeline_orchestrator.py --config ./pipeline-l10n-epic2-static-ui.yaml
#   python claude-pipelines/pipeline_orchestrator.py --config ./pipeline-l10n-epic2-static-ui.yaml --dry-run
#   python claude-pipelines/pipeline_orchestrator.py --config ./pipeline-l10n-epic2-static-ui.yaml --list-tasks
#   python claude-pipelines/pipeline_orchestrator.py --config ./pipeline-l10n-epic2-static-ui.yaml --tasks "1,2,3"
#   python claude-pipelines/pipeline_orchestrator.py --config ./pipeline-l10n-epic2-static-ui.yaml --stages "request,overview"
#
# =============================================================================

pipeline:
  name: l10n-epic2-static-ui-implementation
  version: "1.0"
  description: "Process Localization Epic 2 - Static UI Translation through agent pipeline"
  mode: per_request
  default_timeout: 900

# =============================================================================
# Source Document
# =============================================================================

source:
  path: ../docs/prd/Plan-111-L10N-Epic2-Static-UI-Translation.md

  extraction:
    # Pattern to match tasks like: - [ ] **Task 2H.1:** Create `common` namespace structure
    task_pattern: '^\s*-\s*\[\s*\]\s*\*\*Task\s+([A-Z0-9]+\.[0-9]+):\*\*\s+(.+?)$'
    task_groups:
      id: 1
      title: 2

    # Pattern to match sub-epics like: ## Sub-Epic 2H: Common & Shared Components
    phase_pattern: '^##\s+Sub-Epic\s+([A-Z0-9]+):\s+(.+?)$'
    phase_groups:
      number: 1
      name: 2

    description:
      mode: following_bullets
      end_patterns:
        - '^\s*-\s*\[\s*\]\s*\*\*Task'
        - '^###\s+'
        - '^##\s+'
        - '^---'
        - '^\|\s*'
        - '^```'

# =============================================================================
# Output Locations
# =============================================================================

outputs:
  requests: ../docs/gen_requests_epic2.md
  overviews: ../docs/
  details: ../docs/
  state: ./pipeline-l10n-epic2-static-ui-state.json
  logs: ./pipeline-l10n-epic2-static-ui.log

# =============================================================================
# Request Stages (Per-Request Mode)
# =============================================================================

request_stages:
  # Stage 1: Create Request
  - id: request
    name: "Create Request"
    description: "Convert implementation task into formal requirement"
    enabled: true
    agent:
      name: "01-request-fa"
      invocation_template: "use agent 01-request-fa to create the request for: {full_task}. Write the request to file: {requests_file_path}"
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Bash"
        - "--dangerously-skip-permissions"
      timeout: 300
    output:
      type: append
      file: ../docs/gen_requests_epic2.md

  # Stage 2: Create Overview
  - id: overview
    name: "Create Overview"
    description: "Pull relevant context from codebase for the request"
    enabled: true
    agent:
      name: "02-techlead-overview"
      invocation_template: |
        Acting as a Technical Lead, create an implementation breakdown document for:
        {requests_file_path} - Request #{request_id_num}

        **Implementation Plan Reference**: {implementation_plan_path}

        **Task Context**:
        - Sub-Epic: {phase} - {phase_name}
        - Task ID: {task_id}
        - Title: {task_title}
        - Details:
            {task_description_formatted}

        **Output file**: docs/{request_id}-{task_title_slug}-overview.md

        **Instructions**:
        1. Read the request from {requests_file_path} (find Request #{request_id_num})
        2. Read the implementation plan from {implementation_plan_path}
        3. Investigate the codebase for existing patterns to follow
        4. Understand the Epic 2 context: translating UI strings in 275+ components
        5. Reference Epic 1 foundation (next-intl setup) if needed
        6. Create the overview document following the standard structure
        7. Include an "Authorized Files and Functions for Modification" section
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Bash"
        - "--dangerously-skip-permissions"
      timeout: 720
    output:
      type: file
      directory: ../docs/
      filename: "{request_id}-{task_title_slug}-overview.md"

  # Stage 3: Create Detailed Task Breakdown
  - id: details
    name: "Create Detailed Tasks"
    description: "Break request into 1-point implementation tasks"
    enabled: true
    agent:
      name: "03-senior-dev-task-breakdown"
      invocation_template: |
        Create a detailed task breakdown document for Request #{request_id_num}

        **Input Documents**:
        - Overview document: {overview_file}
        - Requirements: {requests_file_path} (find Request #{request_id_num})
        - Implementation Plan: {implementation_plan_path}

        **Task Context**:
        - Sub-Epic: {phase} - {phase_name}
        - Task ID: {task_id}
        - Title: {task_title}

        **Output file**: docs/{request_id}-{task_title_slug}-detailed.md

        **Important Context**:
        - This is part of a large-scale UI translation effort (Epic 2)
        - Component update pattern: import useTranslations/getTranslations, replace hardcoded strings
        - Translation keys follow namespace.component.element.variant pattern
        - All translations must go in /messages/*.json files
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Bash"
        - "--dangerously-skip-permissions"
      timeout: 600
    output:
      type: file
      directory: ../docs/
      filename: "{request_id}-{task_title_slug}-detailed.md"

  # Stage 4: Implementation
  - id: implementation
    name: "Implementation"
    description: "Autonomously implement all tasks from the detailed specification"
    enabled: true
    agent:
      name: "05-spec-implementation"
      invocation_template: |
        Implement all tasks from the detailed specification for Request #{request_id_num}

        **Detailed Specification**: {details_file}

        **Task Context**:
        - Request ID: {request_id}
        - Sub-Epic: {phase} - {phase_name}
        - Task ID: {task_id}
        - Title: {task_title}

        {project_context}

        **Instructions**:
        1. Read the detailed specification at {details_file}
        2. Execute all tasks following the per-task workflow:
           - Implement -> Verify -> Update Doc -> Build -> Commit
        3. For component updates:
           - Add useTranslations/getTranslations imports
           - Extract hardcoded strings to translation keys
           - Update /messages/en.json with new keys
           - Replace hardcoded strings with t() calls
        4. Mark completed tasks with [x] and add implementation notes
        5. Continue autonomously until all required tasks are complete
        6. Run verification: `npm run type-check` and `npm run build`
        7. Report final status with summary of completed/failed/blocked tasks
        8. **IMPORTANT**: End your response with a test summary in this format:
           ```
           TEST SUMMARY:
           - Type Check: PASSED/FAILED
           - Build: PASSED/FAILED
           - Tests: PASSED/FAILED (if tests were run)
           ```
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Edit,Bash,Glob,Grep"
        - "--dangerously-skip-permissions"
      timeout: 2400
    output:
      type: implementation

# =============================================================================
# Implementation Configuration
# =============================================================================

implementation:
  technology:
    database: none
    browser_testing: false
  required_tools: []
  precheck:
    timeout: 120

# =============================================================================
# Retry Configuration
# =============================================================================

retry:
  max_attempts: 2
  on_failure: skip_and_log
