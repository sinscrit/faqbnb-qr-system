# =============================================================================
# Pipeline Configuration: Localization Epic 1 - Foundation Implementation
# =============================================================================
#
# Generated: 2026-01-17 15:30:00 UTC
# Updated: 2026-01-19 (added context for testcheck/usecases stages)
# Source: ./docs/prd/Plan-110-L10N-Epic1-Foundation.md
#
# This pipeline processes the Localization Epic 1 implementation plan through
# the automated agent workflow (request → overview → details → implementation).
#
# Usage:
#   python pipeline_orchestrator.py --config ./pipeline-l10n-epic1-foundation.yaml
#   python pipeline_orchestrator.py --config ./pipeline-l10n-epic1-foundation.yaml --dry-run
#   python pipeline_orchestrator.py --config ./pipeline-l10n-epic1-foundation.yaml --list-tasks
#   python pipeline_orchestrator.py --config ./pipeline-l10n-epic1-foundation.yaml --tasks "1,2,3"
#   python pipeline_orchestrator.py --config ./pipeline-l10n-epic1-foundation.yaml --stages "request,overview"
#   python pipeline_orchestrator.py --config ./pipeline-l10n-epic1-foundation.yaml --stages "testcheck,usecases"
#
# =============================================================================

pipeline:
  name: l10n-epic1-foundation-implementation
  version: "1.1"
  description: "Process Localization Epic 1 - Foundation implementation plan through agent pipeline"
  mode: per_request
  default_timeout: 900

# =============================================================================
# Context for Pipeline-Level Stages (testcheck, usecases)
# =============================================================================
# This section provides PRD-level context needed by stages 5 and 6

context:
  prd_vision: |
    Establish foundational infrastructure for multi-language support across FAQBNB.
    Enable property owners to serve international guests with localized content.
    Support 6 languages: English, French, Spanish, German, Dutch, Italian.
    Create AI-powered translation service with Claude/OpenAI providers.
    Build background job processing for asynchronous translations.
    Implement language detection and switching infrastructure.

  user_stories:
    - "As a property owner, I want my content translated automatically so international guests can understand instructions"
    - "As a guest, I want to view the app in my preferred language so I can easily navigate the interface"
    - "As a system admin, I want translations processed in the background so the UI remains responsive"
    - "As a developer, I want a unified i18n framework so I can easily add translations to new components"
    - "As a guest, I want my language preference persisted so I don't have to switch languages on every visit"

  key_features:
    - "Translation tables (articles, items, links, tags) with status tracking"
    - "next-intl framework integration for static UI strings"
    - "Claude and OpenAI translation providers with fallback"
    - "Rate limiting and retry logic for API calls"
    - "Background job queue for async translation processing"
    - "LanguageSwitcher component with persistence (DB for users, cookie for guests)"
    - "Language detection utility (user preference > cookie > Accept-Language > default)"
    - "Middleware integration for language context"

  epic_specific_scenarios:
    - "Verify LanguageSwitcher displays all 6 languages with native names"
    - "Test language preference persistence for authenticated users"
    - "Test language preference persistence for guests (cookie-based)"
    - "Verify translation job queue processes jobs correctly"
    - "Test rate limiting prevents API abuse"
    - "Verify retry logic with exponential backoff works on failures"
    - "Test translation tables have correct RLS policies"
    - "Verify next-intl t() function works in sample component"
    - "Test middleware correctly sets language context from detection"
    - "Verify admin translation testing endpoint works"

# =============================================================================
# Source Document
# =============================================================================

source:
  path: ../docs/prd/Plan-110-L10N-Epic1-Foundation.md

  extraction:
    # Pattern to match tasks like: - [ ] **Task 1.1:** Create migration file with all translation tables
    task_pattern: '^\s*-\s*\[\s*\]\s*\*\*Task\s+(\d+\.\d+):\*\*\s+(.+?)$'
    task_groups:
      id: 1
      title: 2

    # Pattern to match phases like: ### Phase 1: Database Foundation (2-3 days)
    phase_pattern: '^###\s+Phase\s+(\d+):\s+(.+?)\s*\('
    phase_groups:
      number: 1
      name: 2

    description:
      mode: following_bullets
      end_patterns:
        - '^\s*-\s*\[\s*\]\s*\*\*Task'
        - '^###\s+'
        - '^##\s+'
        - '^---'
        - '^\|\s*'

# =============================================================================
# Output Locations
# =============================================================================

outputs:
  requests: ../docs/gen_requests.md
  overviews: ../docs/
  details: ../docs/
  state: ./pipeline-l10n-epic1-foundation-state.json
  logs: ./pipeline-l10n-epic1-foundation.log

# =============================================================================
# Request Stages (Per-Request Mode)
# =============================================================================

request_stages:
  # Stage 1: Create Request
  - id: request
    name: "Create Request"
    description: "Convert implementation task into formal requirement"
    enabled: true
    agent:
      name: "01-request-fa"
      invocation_template: "use agent 01-request-fa to create the request for: {full_task}. Write the request to file: {requests_file_path}"
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Bash"
        - "--dangerously-skip-permissions"
      timeout: 240
    output:
      type: append
      file: ../docs/gen_requests.md

  # Stage 2: Create Overview
  - id: overview
    name: "Create Overview"
    description: "Pull relevant context from codebase for the request"
    enabled: true
    agent:
      name: "02-techlead-overview"
      invocation_template: |
        Acting as a Technical Lead, create an implementation breakdown document for:
        {requests_file_path} - Request #{request_id_num}

        **Implementation Plan Reference**: {implementation_plan_path}

        **Task Context**:
        - Phase: {phase} - {phase_name}
        - Task ID: {task_id}
        - Title: {task_title}
        - Details:
            {task_description_formatted}

        **Output file**: docs/{request_id}-{task_title_slug}-overview.md

        **Instructions**:
        1. Read the request from {requests_file_path} (find Request #{request_id_num})
        2. Read the implementation plan from {implementation_plan_path}
        3. Investigate the codebase for existing patterns to follow
        4. Create the overview document following the standard structure
        5. Include an "Authorized Files and Functions for Modification" section
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Bash"
        - "--dangerously-skip-permissions"
      timeout: 660
    output:
      type: file
      directory: ../docs/
      filename: "{request_id}-{task_title_slug}-overview.md"

  # Stage 3: Create Detailed Task Breakdown
  - id: details
    name: "Create Detailed Tasks"
    description: "Break request into 1-point implementation tasks"
    enabled: true
    agent:
      name: "03-senior-dev-task-breakdown"
      invocation_template: |
        Create a detailed task breakdown document for Request #{request_id_num}

        **Input Documents**:
        - Overview document: {overview_file}
        - Requirements: {requests_file_path} (find Request #{request_id_num})
        - Implementation Plan: {implementation_plan_path}

        **Task Context**:
        - Phase: {phase} - {phase_name}
        - Task ID: {task_id}
        - Title: {task_title}

        **Output file**: docs/{request_id}-{task_title_slug}-detailed.md
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Bash"
        - "--dangerously-skip-permissions"
      timeout: 480
    output:
      type: file
      directory: ../docs/
      filename: "{request_id}-{task_title_slug}-detailed.md"

  # Stage 4: Implementation
  - id: implementation
    name: "Implementation"
    description: "Autonomously implement all tasks from the detailed specification"
    enabled: true
    agent:
      name: "05-spec-implementation"
      invocation_template: |
        Implement all tasks from the detailed specification for Request #{request_id_num}

        **Detailed Specification**: {details_file}

        **Task Context**:
        - Request ID: {request_id}
        - Phase: {phase} - {phase_name}
        - Task ID: {task_id}
        - Title: {task_title}

        {project_context}

        **Instructions**:
        1. Read the detailed specification at {details_file}
        2. For EACH subtask in the specification:
           a. Implement the subtask
           b. Verify it works
           c. **IMMEDIATELY update {details_file}**: Change `- [ ]` to `- [x]` for that subtask
           d. **SAVE the file** so progress is visible externally
           e. Continue to the next subtask
        3. This checkpoint-after-each-subtask approach is CRITICAL for progress visibility
        4. Run final verification: `npm run type-check` and `npm run build`
        5. Report final status with summary of completed/failed/blocked tasks
        6. **IMPORTANT**: End your response with a test summary in this format:
           ```
           TEST SUMMARY:
           - Type Check: PASSED/FAILED
           - Build: PASSED/FAILED
           - Tests: PASSED/FAILED (if tests were run)
           ```
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Edit,Bash,Glob,Grep,mcp__supabase__*"
        - "--dangerously-skip-permissions"
      timeout: 1800
    output:
      type: implementation

  # Stage 5: Test Check (Pipeline-level)
  - id: testcheck
    name: "Test Check & Verification"
    description: "Validate implementation against specifications and generate test harness"
    mode: pipeline
    enabled: true
    agent:
      name: "06a-pipeline-testcheck"
      invocation_template: |
        Run pipeline-level test verification for the L10N Epic 1 - Foundation implementation.

        ## Pipeline Context
        **Pipeline Configuration**: {pipeline_yaml_path}
        **State File**: {state_file_path}
        **Implementation Plan**: {implementation_plan_path}
        **Total Tasks**: {total_tasks}
        **Request Range**: REQ-223 through REQ-256

        ## PRD Vision
        {prd_vision}

        ## Key Features to Verify
        {key_features}

        ## Epic-Specific Test Scenarios
        {epic_specific_scenarios}

        ## Instructions
        1. Read the state file to understand which tasks have been implemented
        2. Verify each key feature from the list above:
           - Translation tables exist with correct schema
           - next-intl integration works (check sample component)
           - Translation providers are configured
           - Job queue module exists and has correct types
           - LanguageSwitcher component renders correctly
           - Language detection utility works as expected
           - Middleware handles language context
        3. Run build verification: `npm run type-check` and `npm run build`
        4. Create a test harness page at `/testing/l10n-epic1-testharness.md` that documents:
           - Manual test steps for each epic-specific scenario
           - Expected results
           - Pass/Fail status placeholders
        5. Update the state file with verification results under 'testcheck' key
        6. Report overall verification status with summary

        ## Output Format
        Create the test harness document with this structure:
        - Test Harness Header with epic name and date
        - Build Verification Results
        - Feature Verification Checklist
        - Manual Test Scenarios (from epic_specific_scenarios)
        - Overall Status Summary
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Edit,Bash,Glob,Grep,mcp__supabase__*,mcp__playwright__*"
        - "--dangerously-skip-permissions"
      timeout: 1200
    output:
      type: verification

  # Stage 6: Use Case Generation (Pipeline-level)
  - id: usecases
    name: "Use Case Test Generation"
    description: "Generate aggregate end-to-end test scenarios based on PRD intent"
    mode: pipeline
    enabled: true
    agent:
      name: "06b-usecase-generator"
      invocation_template: |
        Generate end-to-end use case test scenarios for the L10N Epic 1 - Foundation implementation.

        ## Pipeline Context
        **Pipeline Configuration**: {pipeline_yaml_path}
        **State File**: {state_file_path}
        **Implementation Plan**: {implementation_plan_path}
        **Total Tasks**: {total_tasks}
        **Request Range**: REQ-223 through REQ-256

        ## PRD Vision
        {prd_vision}

        ## User Stories
        {user_stories}

        ## Key Features Implemented
        {key_features}

        ## Epic-Specific Scenarios to Cover
        {epic_specific_scenarios}

        ## Instructions
        1. Read the implementation plan to understand the full PRD context
        2. Read the state file to see implementation status for all tasks
        3. Generate comprehensive use case test scenarios organized by:

           **Category 1: Language Switching & Persistence**
           - Guest language switching (cookie-based)
           - Authenticated user language switching (DB-based)
           - Language preference on return visits
           - Language detection priority (preference > cookie > Accept-Language > default)

           **Category 2: Translation Service**
           - Claude provider translation flow
           - OpenAI fallback when Claude fails
           - Rate limiting behavior
           - Retry with exponential backoff

           **Category 3: Background Job Processing**
           - Job queue insertion
           - Job processing lifecycle
           - Concurrent job handling
           - Failed job retry

           **Category 4: UI Integration**
           - LanguageSwitcher component behavior
           - next-intl t() function in components
           - Locale-specific date/number formatting

        4. Write use cases to `/testing/l10n-epic1-usecases.md`
        5. Update state file with use cases under 'usecases' key

        ## Use Case Format
        Each use case should include:
        - UC-E1-XXX: Unique ID
        - Title: Brief description
        - Category: From categories above
        - Preconditions: Required state before test
        - Steps: Numbered test steps
        - Expected Results: What should happen
        - Verification: How to confirm success
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Edit,Bash,Glob,Grep"
        - "--dangerously-skip-permissions"
      timeout: 900
    output:
      type: usecases

# =============================================================================
# Implementation Configuration
# =============================================================================

implementation:
  technology:
    database: supabase
    browser_testing: false
  required_tools:
    - supabase_mcp
  precheck:
    timeout: 120

# =============================================================================
# Retry Configuration
# =============================================================================

retry:
  max_attempts: 2
  on_failure: skip_and_log
