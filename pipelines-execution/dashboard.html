<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipeline Dashboard</title>
    <style>
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-card: #0f3460;
            --text-primary: #e8e8e8;
            --text-secondary: #a0a0a0;
            --accent-blue: #4fc3f7;
            --accent-green: #66bb6a;
            --accent-yellow: #ffca28;
            --accent-red: #ef5350;
            --accent-magenta: #ce93d8;
            --accent-cyan: #4dd0e1;
            --border-color: #2d4a6f;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 10px;
        }
        .header {
            background: var(--bg-secondary);
            border: 2px solid var(--accent-blue);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
        }
        .title { color: var(--accent-blue); font-size: 1.3em; font-weight: bold; }
        .refresh-time { color: var(--text-secondary); font-size: 0.8em; margin-top: 5px; }
        .controls { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .controls button {
            background: var(--accent-blue);
            color: var(--bg-primary);
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .controls label { display: flex; align-items: center; gap: 5px; color: var(--text-secondary); }

        /* Alerts */
        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
        .alert-quota {
            background: rgba(239,83,80,0.2);
            border: 2px solid var(--accent-red);
            color: var(--accent-red);
        }
        .alert-crash {
            background: rgba(255,202,40,0.2);
            border: 2px solid var(--accent-yellow);
            color: var(--accent-yellow);
        }
        .alert-title { font-weight: bold; font-size: 1.1em; margin-bottom: 5px; }

        /* Health Bar */
        .health-bar {
            display: flex;
            gap: 15px;
            padding: 10px;
            background: var(--bg-card);
            border-radius: 6px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .health-item { display: flex; align-items: center; gap: 5px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot-active { background: var(--accent-green); }
        .dot-stalled { background: var(--accent-red); animation: pulse 2s infinite; }
        .dot-completed { background: var(--accent-cyan); }

        /* Pipeline Card */
        .pipeline {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 15px;
            overflow: hidden;
        }
        .pipeline-header {
            background: var(--bg-card);
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        .pipeline-name { font-weight: bold; margin-bottom: 8px; }
        .status-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
        .badge {
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 0.8em;
            font-weight: bold;
        }
        .badge-running { background: var(--accent-yellow); color: #000; }
        .badge-completed { background: var(--accent-green); color: #000; }
        .badge-failed { background: var(--accent-red); color: #fff; }
        .badge-paused { background: var(--text-secondary); color: #000; }

        .progress-bar {
            flex: 1;
            min-width: 100px;
            height: 16px;
            background: var(--bg-primary);
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-green), var(--accent-cyan));
        }
        .progress-text { font-size: 0.85em; }

        .stages { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; font-size: 0.85em; }
        .stage { padding: 3px 6px; background: var(--bg-primary); border-radius: 3px; }
        .stage-done { color: var(--accent-green); }
        .stage-progress { color: var(--accent-yellow); }
        .stage-pending { color: var(--text-secondary); }
        .arrow { color: var(--text-secondary); }

        .current-task {
            margin-top: 8px;
            padding: 6px 10px;
            background: rgba(255,202,40,0.1);
            border-left: 3px solid var(--accent-yellow);
            border-radius: 0 4px 4px 0;
            font-size: 0.9em;
        }

        .update-time {
            margin-top: 8px;
            font-size: 0.85em;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
        }
        .time-fresh { background: rgba(102,187,106,0.2); color: var(--accent-green); }
        .time-warning { background: rgba(255,202,40,0.2); color: var(--accent-yellow); }
        .time-danger { background: rgba(239,83,80,0.2); color: var(--accent-red); }

        /* Kanban */
        .kanban { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 10px; }
        @media (max-width: 800px) { .kanban { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 500px) { .kanban { grid-template-columns: 1fr; } }
        .column { background: var(--bg-primary); border-radius: 6px; }
        .column-header { padding: 8px; font-weight: bold; border-bottom: 2px solid; font-size: 0.9em; }
        .col-backlog .column-header { border-color: var(--text-secondary); }
        .col-progress .column-header { border-color: var(--accent-yellow); color: var(--accent-yellow); }
        .col-done .column-header { border-color: var(--accent-green); color: var(--accent-green); }
        .col-failed .column-header { border-color: var(--accent-red); color: var(--accent-red); }
        .column-content { padding: 8px; max-height: 200px; overflow-y: auto; }
        .task { background: var(--bg-secondary); padding: 6px 8px; margin-bottom: 6px; border-radius: 4px; font-size: 0.8em; }
        .task-id { color: var(--accent-cyan); font-weight: bold; }
        .no-tasks { color: var(--text-secondary); font-style: italic; font-size: 0.85em; }

        /* Epics */
        .epics {
            background: var(--bg-secondary);
            border: 2px solid var(--accent-magenta);
            border-radius: 8px;
            padding: 12px;
            margin-top: 15px;
        }
        .epics-title { color: var(--accent-magenta); font-weight: bold; margin-bottom: 10px; }
        .epic-row { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
        .epic-row:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
        .epic-name { color: var(--accent-cyan); font-weight: bold; }
        .epic-time { color: var(--text-secondary); font-size: 0.85em; }

        .loading { text-align: center; padding: 40px; color: var(--text-secondary); }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">Pipeline Dashboard</div>
        <div class="refresh-time">Last refresh: <span id="lastRefresh">-</span></div>
        <div class="controls">
            <button onclick="loadDefaultFiles()">Refresh</button>
            <label><input type="checkbox" id="autoRefresh" onchange="toggleAutoRefresh()"> Auto (5s)</label>
        </div>
    </div>

    <div id="quotaAlert" class="alert alert-quota" style="display:none;">
        <div class="alert-title">Claude Usage Limit Reached</div>
        <div id="quotaMessage">Will auto-resume when allowance resets</div>
    </div>

    <div id="crashAlert" class="alert alert-crash" style="display:none;">
        <div class="alert-title">Pipeline Process Stopped</div>
        <div id="crashMessage">Orchestrator may need restart</div>
    </div>

    <div id="healthBar" class="health-bar" style="display:none;">
        <div class="health-item"><span>Health:</span> <span id="healthSummary"></span></div>
    </div>

    <div id="container"><div class="loading">Loading...</div></div>

    <div id="epicsPanel" class="epics" style="display:none;">
        <div class="epics-title">Epics Summary</div>
        <div id="epicsContent"></div>
    </div>

    <script>
        let pipelines = [];
        let autoRefreshInterval = null;
        const FILES = [
            'pipeline-l10n-epic1-foundation-state.json',
            'pipeline-l10n-epic2-static-ui-state.json',
            'pipeline-l10n-epic3-dynamic-content-state.json',
            'pipeline-l10n-epic4-guest-experience-state.json',
            'pipeline-l10n-epic5-owner-management-state.json'
        ];

        function timeSince(iso) {
            if (!iso) return 'unknown';
            const secs = Math.floor((new Date() - new Date(iso)) / 1000);
            if (secs < 60) return secs + 's ago';
            if (secs < 3600) return Math.floor(secs/60) + 'm ago';
            if (secs < 86400) return Math.floor(secs/3600) + 'h ' + Math.floor((secs%3600)/60) + 'm ago';
            return Math.floor(secs/86400) + 'd ago';
        }

        function timeClass(iso) {
            if (!iso) return 'time-fresh';
            const secs = (new Date() - new Date(iso)) / 1000;
            if (secs < 120) return 'time-fresh';
            if (secs < 300) return 'time-warning';
            return 'time-danger';
        }

        function stallStatus(iso, status) {
            if (status === 'completed') return 'completed';
            if (!iso) return 'active';
            const secs = (new Date() - new Date(iso)) / 1000;
            if (secs < 120) return 'active';
            if (secs < 300) return 'maybe';
            return 'stalled';
        }

        function analyzeStall(data) {
            const errs = JSON.stringify(data.errors || []).toLowerCase();
            const quotaPatterns = ['rate limit', '429', 'quota', 'exceeded', 'exhausted', 'usage limit', 'allowance'];
            for (const p of quotaPatterns) {
                if (errs.includes(p)) return { type: 'quota', msg: 'Usage limit' };
            }
            return { type: 'crash', msg: 'Process stopped' };
        }

        function stageColor(done, total) {
            if (done === total && total > 0) return 'stage-done';
            if (done > 0) return 'stage-progress';
            return 'stage-pending';
        }

        function pct(d, t) { return t > 0 ? Math.round(d/t*100) : 0; }

        function renderStage(label, done, total) {
            return `<span class="stage ${stageColor(done,total)}">${label}:${done}/${total} (${pct(done,total)}%)</span>`;
        }

        function renderPipeline(d) {
            const tasks = d.tasks || [];
            const total = tasks.length;
            const stats = {
                r: tasks.filter(t => t.request_completed).length,
                o: tasks.filter(t => t.overview_completed).length,
                d: tasks.filter(t => t.details_completed).length,
                i: tasks.filter(t => t.implementation_completed).length
            };
            const progress = pct(stats.r + stats.o + stats.d + stats.i, total * 4);
            const done = stats.i;
            const status = d.status || 'unknown';
            const badgeClass = status === 'completed' ? 'badge-completed' : status === 'running' ? 'badge-running' : status === 'failed' ? 'badge-failed' : 'badge-paused';

            let currentTask = '';
            for (const t of tasks) {
                if (!t.implementation_completed) {
                    currentTask = `<div class="current-task">▶ ${t.id}: ${(t.title||'').substring(0,40)}...</div>`;
                    break;
                }
            }

            const byStatus = { backlog: [], progress: [], done: [], failed: [] };
            tasks.forEach(t => {
                if (t.status === 'failed' || t.error) byStatus.failed.push(t);
                else if (t.implementation_completed) byStatus.done.push(t);
                else if (t.status === 'processing') byStatus.progress.push(t);
                else byStatus.backlog.push(t);
            });

            const renderCol = (name, cls, items) => {
                const content = items.length === 0 ? '<div class="no-tasks">No tasks</div>' :
                    items.slice(0,5).map(t => `<div class="task"><span class="task-id">${t.id}</span> ${(t.title||'').substring(0,25)}...</div>`).join('') +
                    (items.length > 5 ? `<div class="no-tasks">+${items.length-5} more</div>` : '');
                return `<div class="column ${cls}"><div class="column-header">${name} (${items.length})</div><div class="column-content">${content}</div></div>`;
            };

            return `
                <div class="pipeline">
                    <div class="pipeline-header">
                        <div class="pipeline-name">${d.pipeline || 'Unknown'}</div>
                        <div class="status-row">
                            <span class="badge ${badgeClass}">${status}</span>
                            <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
                            <span class="progress-text">${progress}% (${done}/${total})</span>
                        </div>
                        <div class="stages">
                            ${renderStage('R', stats.r, total)}
                            <span class="arrow">→</span>
                            ${renderStage('O', stats.o, total)}
                            <span class="arrow">→</span>
                            ${renderStage('D', stats.d, total)}
                            <span class="arrow">→</span>
                            ${renderStage('I', stats.i, total)}
                        </div>
                        ${currentTask}
                        <div class="update-time ${timeClass(d.updated_at)}">Updated: ${timeSince(d.updated_at)}</div>
                    </div>
                    <div class="kanban">
                        ${renderCol('Backlog', 'col-backlog', byStatus.backlog)}
                        ${renderCol('In Progress', 'col-progress', byStatus.progress)}
                        ${renderCol('Done', 'col-done', byStatus.done.reverse())}
                        ${renderCol('Failed', 'col-failed', byStatus.failed)}
                    </div>
                </div>
            `;
        }

        function renderHealth() {
            let active = 0, stalled = 0, completed = 0, quotaIssue = false;
            pipelines.forEach(d => {
                const ss = stallStatus(d.updated_at, d.status);
                if (d.status === 'completed') completed++;
                else if (ss === 'active') active++;
                else { stalled++; if (analyzeStall(d).type === 'quota') quotaIssue = true; }
            });

            document.getElementById('healthBar').style.display = pipelines.length ? 'flex' : 'none';
            document.getElementById('healthSummary').innerHTML =
                (active ? `<span class="health-item"><span class="dot dot-active"></span>${active} active</span>` : '') +
                (completed ? `<span class="health-item"><span class="dot dot-completed"></span>${completed} done</span>` : '') +
                (stalled ? `<span class="health-item"><span class="dot dot-stalled"></span>${stalled} stalled</span>` : '');

            document.getElementById('quotaAlert').style.display = quotaIssue ? 'block' : 'none';
            document.getElementById('crashAlert').style.display = (stalled > 0 && !quotaIssue) ? 'block' : 'none';
        }

        function renderEpics() {
            const recent = pipelines.filter(d => {
                if (!d.updated_at || !(d.pipeline||'').includes('epic')) return false;
                return (new Date() - new Date(d.updated_at)) < 600000;
            });
            if (recent.length === 0) { document.getElementById('epicsPanel').style.display = 'none'; return; }
            document.getElementById('epicsPanel').style.display = 'block';

            document.getElementById('epicsContent').innerHTML = recent.map(d => {
                const tasks = d.tasks || [];
                const total = tasks.length;
                const stats = {
                    r: tasks.filter(t => t.request_completed).length,
                    o: tasks.filter(t => t.overview_completed).length,
                    d: tasks.filter(t => t.details_completed).length,
                    i: tasks.filter(t => t.implementation_completed).length
                };
                const match = (d.pipeline||'').match(/epic(\d+)/i);
                const name = match ? 'Epic ' + match[1] : d.pipeline;
                return `
                    <div class="epic-row">
                        <span class="epic-name">${name}</span>
                        <span class="badge badge-${d.status === 'completed' ? 'completed' : 'running'}">${d.status}</span>
                        <span class="epic-time">${timeSince(d.updated_at)}</span>
                        <div class="stages" style="margin-top:5px;">
                            ${renderStage('R', stats.r, total)}
                            <span class="arrow">→</span>
                            ${renderStage('O', stats.o, total)}
                            <span class="arrow">→</span>
                            ${renderStage('D', stats.d, total)}
                            <span class="arrow">→</span>
                            ${renderStage('I', stats.i, total)}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function render() {
            if (pipelines.length === 0) {
                document.getElementById('container').innerHTML = '<div class="loading">No pipelines found</div>';
                return;
            }
            renderHealth();
            document.getElementById('container').innerHTML = pipelines.map(renderPipeline).join('');
            renderEpics();
            document.getElementById('lastRefresh').textContent = new Date().toLocaleTimeString();
        }

        async function loadDefaultFiles() {
            pipelines = [];
            for (const f of FILES) {
                try {
                    const res = await fetch(f);
                    if (res.ok) pipelines.push(await res.json());
                } catch(e) {}
            }
            render();
        }

        function toggleAutoRefresh() {
            if (document.getElementById('autoRefresh').checked) {
                autoRefreshInterval = setInterval(loadDefaultFiles, 5000);
            } else {
                clearInterval(autoRefreshInterval);
            }
        }

        loadDefaultFiles();
    </script>
</body>
</html>
