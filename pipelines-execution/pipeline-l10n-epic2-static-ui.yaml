# =============================================================================
# Pipeline Configuration: Localization Epic 2 - Static UI Translation
# =============================================================================
#
# Generated: 2026-01-17 23:15:00 UTC
# Source: ./docs/prd/Plan-111-L10N-Epic2-Static-UI-Translation.md
#
# This pipeline processes the Localization Epic 2 - Static UI Translation
# implementation plan through the automated agent workflow
# (request → overview → details → implementation).
#
# Epic Overview:
#   - Scope: Extract ~3,200 UI strings from 275+ React components
#   - Languages: 6 (en, fr, es, de, nl, it)
#   - Sub-Epics: 10 feature areas
#   - Total Translation Entries: ~19,200
#
# Usage:
#   python claude-pipelines/pipeline_orchestrator.py --config ./pipeline-l10n-epic2-static-ui.yaml
#   python claude-pipelines/pipeline_orchestrator.py --config ./pipeline-l10n-epic2-static-ui.yaml --dry-run
#   python claude-pipelines/pipeline_orchestrator.py --config ./pipeline-l10n-epic2-static-ui.yaml --list-tasks
#   python claude-pipelines/pipeline_orchestrator.py --config ./pipeline-l10n-epic2-static-ui.yaml --tasks "1,2,3"
#   python claude-pipelines/pipeline_orchestrator.py --config ./pipeline-l10n-epic2-static-ui.yaml --stages "request,overview"
#
# =============================================================================

pipeline:
  name: l10n-epic2-static-ui-implementation
  version: "1.0"
  description: "Process Localization Epic 2 - Static UI Translation through agent pipeline"
  epic_id: E02  # Epic identifier for REQ numbering (REQ-E02-XXX format)
  mode: per_request
  default_timeout: 900

# =============================================================================
# Source Document
# =============================================================================

source:
  path: ../docs/prd/Plan-111-L10N-Epic2-Static-UI-Translation.md

  extraction:
    # Pattern to match tasks like: - [ ] **Task 2H.1:** Create `common` namespace structure
    task_pattern: '^\s*-\s*\[\s*\]\s*\*\*Task\s+([A-Z0-9]+\.[0-9]+):\*\*\s+(.+?)$'
    task_groups:
      id: 1
      title: 2

    # Pattern to match sub-epics like: ## Sub-Epic 2H: Common & Shared Components
    phase_pattern: '^##\s+Sub-Epic\s+([A-Z0-9]+):\s+(.+?)$'
    phase_groups:
      number: 1
      name: 2

    description:
      mode: following_bullets
      end_patterns:
        - '^\s*-\s*\[\s*\]\s*\*\*Task'
        - '^###\s+'
        - '^##\s+'
        - '^---'
        - '^\|\s*'
        - '^```'

# =============================================================================
# Output Locations
# =============================================================================

outputs:
  requests: ../docs/gen_requests.md
  overviews: ../docs/
  details: ../docs/
  state: ./pipeline-l10n-epic2-static-ui-state.json
  logs: ./pipeline-l10n-epic2-static-ui.log

# =============================================================================
# Request Stages (Per-Request Mode)
# =============================================================================

request_stages:
  # Stage 1: Create Request
  - id: request
    name: "Create Request"
    description: "Convert implementation task into formal requirement"
    enabled: true
    agent:
      name: "01-request-fa"
      invocation_template: "use agent 01-request-fa to create the request for: {full_task}. Write the request to file: {requests_file_path}"
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Bash"
        - "--dangerously-skip-permissions"
      timeout: 300
    output:
      type: append
      file: ../docs/gen_requests.md

  # Stage 2: Create Overview
  - id: overview
    name: "Create Overview"
    description: "Pull relevant context from codebase for the request"
    enabled: true
    agent:
      name: "02-techlead-overview"
      invocation_template: |
        Acting as a Technical Lead, create an implementation breakdown document for:
        {requests_file_path} - Request #{request_id_num}

        **Implementation Plan Reference**: {implementation_plan_path}

        **Task Context**:
        - Sub-Epic: {phase} - {phase_name}
        - Task ID: {task_id}
        - Title: {task_title}
        - Details:
            {task_description_formatted}

        **Output file**: docs/{request_id}-{task_title_slug}-overview.md

        **Instructions**:
        1. Read the request from {requests_file_path} (find Request #{request_id_num})
        2. Read the implementation plan from {implementation_plan_path}
        3. Investigate the codebase for existing patterns to follow
        4. Understand the Epic 2 context: translating UI strings in 275+ components
        5. Reference Epic 1 foundation (next-intl setup) if needed
        6. Create the overview document following the standard structure
        7. Include an "Authorized Files and Functions for Modification" section
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Bash"
        - "--dangerously-skip-permissions"
      timeout: 720
    output:
      type: file
      directory: ../docs/
      filename: "{request_id}-{task_title_slug}-overview.md"

  # Stage 3: Create Detailed Task Breakdown
  - id: details
    name: "Create Detailed Tasks"
    description: "Break request into 1-point implementation tasks"
    enabled: true
    agent:
      name: "03-senior-dev-task-breakdown"
      invocation_template: |
        Create a detailed task breakdown document for Request #{request_id_num}

        **Input Documents**:
        - Overview document: {overview_file}
        - Requirements: {requests_file_path} (find Request #{request_id_num})
        - Implementation Plan: {implementation_plan_path}

        **Task Context**:
        - Sub-Epic: {phase} - {phase_name}
        - Task ID: {task_id}
        - Title: {task_title}

        **Output file**: docs/{request_id}-{task_title_slug}-detailed.md

        **Important Context**:
        - This is part of a large-scale UI translation effort (Epic 2)
        - Component update pattern: import useTranslations/getTranslations, replace hardcoded strings
        - Translation keys follow namespace.component.element.variant pattern
        - All translations must go in /messages/*.json files
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Bash"
        - "--dangerously-skip-permissions"
      timeout: 600
    output:
      type: file
      directory: ../docs/
      filename: "{request_id}-{task_title_slug}-detailed.md"

  # Stage 4: Implementation
  - id: implementation
    name: "Implementation"
    description: "Autonomously implement all tasks from the detailed specification"
    enabled: true
    agent:
      name: "05-spec-implementation"
      invocation_template: |
        Implement all tasks from the detailed specification for Request #{request_id_num}

        **Detailed Specification**: {details_file}

        **Task Context**:
        - Request ID: {request_id}
        - Sub-Epic: {phase} - {phase_name}
        - Task ID: {task_id}
        - Title: {task_title}

        {project_context}

        **Instructions**:
        1. Read the detailed specification at {details_file}
        2. For EACH subtask in the specification:
           a. Implement the subtask
           b. Verify it works
           c. **IMMEDIATELY update {details_file}**: Change `- [ ]` to `- [x]` for that subtask
           d. **SAVE the file** so progress is visible externally
           e. Continue to the next subtask
        3. This checkpoint-after-each-subtask approach is CRITICAL for progress visibility
        4. For component updates:
           - Add useTranslations/getTranslations imports
           - Extract hardcoded strings to translation keys
           - Update /messages/en.json with new keys
           - Replace hardcoded strings with t() calls
           - **IMPORTANT**: If creating helper functions that accept a translator (`t`),
             use the shared type: `import type {{ TranslationFn }} from '@/types';`
             Do NOT define custom types like `(key: string, params?: Record<string, unknown>) => string`
        5. Continue autonomously until all required tasks are complete
        6. Run verification: `npm run type-check` and `npm run build`
        7. Report final status with summary of completed/failed/blocked tasks
        8. **IMPORTANT**: End your response with a test summary in this format:
           ```
           TEST SUMMARY:
           - Type Check: PASSED/FAILED
           - Build: PASSED/FAILED
           - Tests: PASSED/FAILED (if tests were run)
           ```
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Edit,Bash,Glob,Grep"
        - "--dangerously-skip-permissions"
      timeout: 2400
    output:
      type: implementation

  # Stage 5: Test Check (Pipeline-level)
  - id: testcheck
    name: "Test Check & Verification"
    description: "Validate implementation against specifications and generate test harness"
    mode: pipeline
    enabled: true
    agent:
      name: "06a-pipeline-testcheck"
      invocation_template: |
        Run pipeline-level test verification for the L10N Epic 2 - Static UI Translation implementation.

        ## Pipeline Context
        **Pipeline Configuration**: {pipeline_yaml_path}
        **State File**: {state_file_path}
        **Implementation Plan**: {implementation_plan_path}
        **Total Tasks**: {total_tasks}

        ## PRD Vision
        {prd_vision}

        ## Key Features to Verify
        {key_features}

        ## Epic-Specific Test Scenarios
        {epic_specific_scenarios}

        ## Instructions
        1. Read the state file to understand which tasks have been implemented
        2. Verify each key feature:
           - UI strings extracted to translation namespaces
           - next-intl useTranslations/getTranslations integration
           - Translation JSON files have correct structure
           - Components render translated strings correctly
        3. Run build verification: `npm run type-check` and `npm run build`
        4. Update the state file with verification results under 'testcheck' key
        5. Report overall verification status with summary
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Edit,Bash,Glob,Grep,mcp__supabase__list_tables,mcp__supabase__execute_sql,mcp__supabase__apply_migration,mcp__supabase__list_migrations,mcp__supabase__generate_typescript_types,mcp__supabase__get_project_url,mcp__playwright__*"
        - "--dangerously-skip-permissions"
      timeout: 1200
    output:
      type: verification

  # Stage 6: Use Case Generation (Pipeline-level)
  - id: usecases
    name: "Use Case Test Generation"
    description: "Generate aggregate end-to-end test scenarios based on PRD intent"
    mode: pipeline
    enabled: true
    agent:
      name: "06b-usecase-generator"
      invocation_template: |
        Generate end-to-end use case test scenarios for the L10N Epic 2 - Static UI Translation implementation.

        ## Pipeline Context
        **Pipeline Configuration**: {pipeline_yaml_path}
        **State File**: {state_file_path}
        **Implementation Plan**: {implementation_plan_path}
        **Total Tasks**: {total_tasks}

        ## PRD Vision
        {prd_vision}

        ## User Stories
        {user_stories}

        ## Key Features Implemented
        {key_features}

        ## Epic-Specific Scenarios to Cover
        {epic_specific_scenarios}

        ## Instructions
        1. Read the implementation plan to understand the full PRD context
        2. Read the state file to see implementation status for all tasks
        3. Generate comprehensive use case test scenarios covering:
           - Static UI string translation rendering
           - Language switching with UI updates
           - Translation key coverage across components
           - Fallback behavior for missing translations
        4. Update state file with use cases under 'usecases' key

        ## Use Case Format
        Each use case should include:
        - UC-E2-XXX: Unique ID
        - Title: Brief description
        - Category: happy-path, edge-case, error-handling, integration
        - Steps: Numbered test steps
        - Expected Results: What should happen
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Edit,Bash,Glob,Grep"
        - "--dangerously-skip-permissions"
      timeout: 900
    output:
      type: usecases

# =============================================================================
# Implementation Configuration
# =============================================================================

implementation:
  technology:
    database: none
    browser_testing: false
  required_tools: []
  precheck:
    timeout: 120

# =============================================================================
# Retry Configuration
# =============================================================================

retry:
  max_attempts: 2
  on_failure: skip_and_log
