# =============================================================================
# Pipeline Configuration: Localization Epic 5 - Owner Translation Management
# =============================================================================
#
# Generated: 2026-01-17 15:45:00 UTC
# Source: ./docs/prd/Plan-111-L10N-Epic5-Owner-Translation-Management.md
#
# This pipeline processes the Localization Epic 5 implementation plan through
# the automated agent workflow (request → overview → details → implementation).
# This epic focuses on UI components for translation management, preview panels,
# bulk operations, and owner workflows.
#
# Usage:
#   python claude-pipelines/pipeline_orchestrator.py --config ./pipeline-l10n-epic5-owner-management.yaml
#   python claude-pipelines/pipeline_orchestrator.py --config ./pipeline-l10n-epic5-owner-management.yaml --dry-run
#   python claude-pipelines/pipeline_orchestrator.py --config ./pipeline-l10n-epic5-owner-management.yaml --list-tasks
#   python claude-pipelines/pipeline_orchestrator.py --config ./pipeline-l10n-epic5-owner-management.yaml --tasks "1,2,3"
#   python claude-pipelines/pipeline_orchestrator.py --config ./pipeline-l10n-epic5-owner-management.yaml --stages "request,overview"
#
# =============================================================================

pipeline:
  name: l10n-epic5-owner-management-implementation
  version: "1.0"
  description: "Process Localization Epic 5 - Owner Translation Management implementation plan through agent pipeline"
  epic_id: E05  # Epic identifier for REQ numbering (REQ-E05-XXX format)
  mode: per_request
  default_timeout: 900

# =============================================================================
# Source Document
# =============================================================================

source:
  path: ../docs/prd/Plan-111-L10N-Epic5-Owner-Translation-Management.md

  extraction:
    # Pattern to match tasks like: - [ ] **Task 1.1:** Create translation status API endpoint
    task_pattern: '^\s*-\s*\[\s*\]\s*\*\*Task\s+(\d+\.\d+):\*\*\s+(.+?)$'
    task_groups:
      id: 1
      title: 2

    # Pattern to match phases like: ### Phase 1: API Endpoints (2-3 days)
    phase_pattern: '^###\s+Phase\s+(\d+):\s+(.+?)\s*\('
    phase_groups:
      number: 1
      name: 2

    description:
      mode: following_bullets
      end_patterns:
        - '^\s*-\s*\[\s*\]\s*\*\*Task'
        - '^###\s+'
        - '^##\s+'
        - '^---'
        - '^\|\s*'

# =============================================================================
# Output Locations
# =============================================================================

outputs:
  requests: ../docs/gen_requests.md
  overviews: ../docs/
  details: ../docs/
  state: ./pipeline-l10n-epic5-owner-management-state.json
  logs: ./pipeline-l10n-epic5-owner-management.log

# =============================================================================
# Request Stages (Per-Request Mode)
# =============================================================================

request_stages:
  # Stage 1: Create Request
  - id: request
    name: "Create Request"
    description: "Convert implementation task into formal requirement"
    enabled: true
    agent:
      name: "01-request-fa"
      invocation_template: "use agent 01-request-fa to create the request for: {full_task}. Write the request to file: {requests_file_path}"
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Bash"
        - "--dangerously-skip-permissions"
      timeout: 240
    output:
      type: append
      file: ../docs/gen_requests.md

  # Stage 2: Create Overview
  - id: overview
    name: "Create Overview"
    description: "Pull relevant context from codebase for the request"
    enabled: true
    agent:
      name: "02-techlead-overview"
      invocation_template: |
        Acting as a Technical Lead, create an implementation breakdown document for:
        {requests_file_path} - Request #{request_id_num}

        **Implementation Plan Reference**: {implementation_plan_path}

        **Task Context**:
        - Phase: {phase} - {phase_name}
        - Task ID: {task_id}
        - Title: {task_title}
        - Details:
            {task_description_formatted}

        **Output file**: docs/{request_id}-{task_title_slug}-overview.md

        **Instructions**:
        1. Read the request from {requests_file_path} (find Request #{request_id_num})
        2. Read the implementation plan from {implementation_plan_path}
        3. Investigate the codebase for existing patterns to follow (particularly ItemManager components, dashboard layout, Radix Dialog patterns)
        4. Review translation table schemas and Epic 1/Epic 3 dependencies
        5. Create the overview document following the standard structure
        6. Include an "Authorized Files and Functions for Modification" section
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Bash"
        - "--dangerously-skip-permissions"
      timeout: 720
    output:
      type: file
      directory: ../docs/
      filename: "{request_id}-{task_title_slug}-overview.md"

  # Stage 3: Create Detailed Task Breakdown
  - id: details
    name: "Create Detailed Tasks"
    description: "Break request into 1-point implementation tasks"
    enabled: true
    agent:
      name: "03-senior-dev-task-breakdown"
      invocation_template: |
        Create a detailed task breakdown document for Request #{request_id_num}

        **Input Documents**:
        - Overview document: {overview_file}
        - Requirements: {requests_file_path} (find Request #{request_id_num})
        - Implementation Plan: {implementation_plan_path}

        **Task Context**:
        - Phase: {phase} - {phase_name}
        - Task ID: {task_id}
        - Title: {task_title}

        **Output file**: docs/{request_id}-{task_title_slug}-detailed.md
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Bash"
        - "--dangerously-skip-permissions"
      timeout: 540
    output:
      type: file
      directory: ../docs/
      filename: "{request_id}-{task_title_slug}-detailed.md"

  # Stage 4: Implementation
  - id: implementation
    name: "Implementation"
    description: "Autonomously implement all tasks from the detailed specification"
    enabled: true
    agent:
      name: "04-spec-implementation"
      invocation_template: |
        Implement all tasks from the detailed specification for Request #{request_id_num}

        **Detailed Specification**: {details_file}

        **Task Context**:
        - Request ID: {request_id}
        - Phase: {phase} - {phase_name}
        - Task ID: {task_id}
        - Title: {task_title}

        {project_context}

        **Instructions**:
        1. Read the detailed specification at {details_file}
        2. For EACH subtask in the specification:
           a. Implement the subtask
           b. Verify it works
           c. **IMMEDIATELY update {details_file}**: Change `- [ ]` to `- [x]` for that subtask
           d. **SAVE the file** so progress is visible externally
           e. Continue to the next subtask
        3. This checkpoint-after-each-subtask approach is CRITICAL for progress visibility
        4. Run final verification: `npm run type-check` and `npm run build`
        5. For UI components: Test in browser if applicable
        6. Report final status with summary of completed/failed/blocked tasks
        7. **IMPORTANT**: End your response with a test summary in this format:
           ```
           TEST SUMMARY:
           - Type Check: PASSED/FAILED
           - Build: PASSED/FAILED
           - Browser Testing: COMPLETED/SKIPPED (if applicable)
           ```
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Edit,Bash,Glob,Grep,mcp__supabase__list_tables,mcp__supabase__execute_sql,mcp__supabase__apply_migration,mcp__supabase__list_migrations,mcp__supabase__generate_typescript_types,mcp__supabase__get_project_url,mcp__playwright__*"
      timeout: 2400
    output:
      type: implementation


  # Stage 5: QA Validation
  - id: qa_validation
    name: "QA Validation"
    description: "Validate that implementation matches the detailed specification"
    enabled: true
    validates: implementation
    max_validation_retries: 1
    agent:
      name: "05-qa-validation"
      invocation_template: |
        Validate the implementation for Request #{request_id_num}

        **Detailed Specification**: {details_file}

        **Task Context**:
        - Request ID: {request_id}
        - Task ID: {task_id}
        - Title: {task_title}

        **Instructions**:
        1. Read the detailed specification at {details_file}
        2. For EACH subtask marked as complete ([x]):
           a. Verify the implementation matches what was specified
           b. Check the implementation note matches the actual code
           c. Verify the target files exist and contain the expected changes
        3. Run type check and build verification
        4. Output a QA Validation Report with:
           - **Status**: PASS or FAIL
           - Summary of subtasks checked
           - Detailed issues (if any) with specific fix instructions
        5. If issues found, format them clearly for the implementation agent to fix on retry
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Glob,Grep,Bash"
        - "--dangerously-skip-permissions"
      timeout: 1200
    output:
      type: validation
  # Stage 6: Test Check (Pipeline-level)
  - id: testcheck
    name: "Test Check & Verification"
    description: "Validate implementation against specifications and generate test harness"
    mode: pipeline
    enabled: true
    agent:
      name: "06a-pipeline-testcheck"
      invocation_template: |
        Run pipeline-level test verification for the L10N Epic 5 - Owner Management implementation.

        ## Pipeline Context
        **Pipeline Configuration**: {pipeline_yaml_path}
        **State File**: {state_file_path}
        **Implementation Plan**: {implementation_plan_path}
        **Total Tasks**: {total_tasks}

        ## PRD Vision
        {prd_vision}

        ## Key Features to Verify
        {key_features}

        ## Epic-Specific Test Scenarios
        {epic_specific_scenarios}

        ## Instructions
        1. Read the state file to understand which tasks have been implemented
        2. Verify each key feature:
           - Owner dashboard translated correctly
           - Property management UI translations
           - Translation management interface
           - Owner language preferences
        3. Run build verification: `npm run type-check` and `npm run build`
        4. Update the state file with verification results under 'testcheck' key
        5. Report overall verification status with summary
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Edit,Bash,Glob,Grep,mcp__supabase__list_tables,mcp__supabase__execute_sql,mcp__supabase__apply_migration,mcp__supabase__list_migrations,mcp__supabase__generate_typescript_types,mcp__supabase__get_project_url,mcp__playwright__*"
        - "--dangerously-skip-permissions"
      timeout: 1200
    output:
      type: verification

  # Stage 7: Use Case Generation (Pipeline-level)
  - id: usecases
    name: "Use Case Test Generation"
    description: "Generate aggregate end-to-end test scenarios based on PRD intent"
    mode: pipeline
    enabled: true
    agent:
      name: "06b-usecase-generator"
      invocation_template: |
        Generate end-to-end use case test scenarios for the L10N Epic 5 - Owner Management implementation.

        ## Pipeline Context
        **Pipeline Configuration**: {pipeline_yaml_path}
        **State File**: {state_file_path}
        **Implementation Plan**: {implementation_plan_path}
        **Total Tasks**: {total_tasks}

        ## PRD Vision
        {prd_vision}

        ## User Stories
        {user_stories}

        ## Key Features Implemented
        {key_features}

        ## Epic-Specific Scenarios to Cover
        {epic_specific_scenarios}

        ## Instructions
        1. Read the implementation plan to understand the full PRD context
        2. Read the state file to see implementation status for all tasks
        3. Generate comprehensive use case test scenarios covering:
           - Owner dashboard language switching
           - Property content translation management
           - Translation status monitoring
           - Multi-language content preview
        4. Update state file with use cases under 'usecases' key

        ## Use Case Format
        Each use case should include:
        - UC-E5-XXX: Unique ID
        - Title: Brief description
        - Category: happy-path, edge-case, error-handling, integration
        - Steps: Numbered test steps
        - Expected Results: What should happen
      command:
        - "claude"
        - "-p"
        - "{prompt}"
        - "--allowedTools"
        - "Read,Write,Edit,Bash,Glob,Grep"
        - "--dangerously-skip-permissions"
      timeout: 900
    output:
      type: usecases

# =============================================================================
# Implementation Configuration
# =============================================================================

implementation:
  technology:
    database: supabase
    browser_testing: true
  required_tools:
    - supabase_mcp
    - playwright_mcp
  precheck:
    timeout: 120

# =============================================================================
# Retry Configuration
# =============================================================================

retry:
  max_attempts: 2
  on_failure: skip_and_log
