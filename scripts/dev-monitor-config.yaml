# =============================================================================
# Dev Server Monitor Configuration
# =============================================================================
# Created: 2026-01-10
#
# This file configures the dev-monitor.py daemon that monitors the Next.js
# development server and automatically handles common issues.
# =============================================================================

monitor:
  check_interval: 10        # Seconds between health checks
  check_timeout: 5          # Seconds to wait for server response
  max_restart_attempts: 2   # Restart attempts before escalating
  server_start_timeout: 90  # Seconds to wait for server to be ready (longer for dev)

  # Active development mode - expects frequent changes
  active_dev_mode: true
  cooldown_after_restart: 30  # Seconds to wait after restart before checking again

server:
  url: http://localhost:3000
  command: npm run dev
  working_directory: .

auto_fix:
  enabled: true
  clear_cache: true          # Clear .next/cache on corruption
  kill_port_conflicts: true  # Kill non-node processes on port 3000
  max_memory_mb: 4096        # Memory limit for node restart

claude:
  enabled: true
  max_diagnoses_per_hour: 20  # Higher limit for active dev
  cooldown_minutes: 5         # Don't call Claude again for same issue within 5 min
  allowed_tools: Read,Bash,Glob,Grep

  # Only call Claude for these issue types (skip known dev errors)
  trigger_on:
    - port_conflict
    - cache_corruption
    - memory_exhaustion
    - unknown_error

  # Skip Claude for these (developer is likely aware)
  skip_on:
    - typescript_error    # Dev knows they broke something
    - build_error         # Dev is actively changing code

# File paths (relative to project root)
files:
  log_file: scripts/dev-monitor.log
  pid_file: scripts/dev-monitor.pid
  server_log_file: /tmp/dev-server.log
